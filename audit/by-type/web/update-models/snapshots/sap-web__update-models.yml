name: Update SAP Models
on:
  repository_dispatch:
    types: [sap-models-update]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Mint GitHub App token (Release Bot)
        id: release_bot_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_RELEASE_APP_ID }}
          private-key: ${{ secrets.BOT_RELEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.release_bot_token.outputs.token }}

      - name: Setup Git authentication
        run: |
          git config user.email "180547681+veamstudios-release-bot[bot]@users.noreply.github.com"
          git config user.name "Release Bot"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Log in to the registry
        run: |
          npm set "@veamstudios:registry" "https://npm.pkg.github.com"
          npm set "//npm.pkg.github.com/:_authToken" "${{ steps.release_bot_token.outputs.token }}"

      - name: Update package
        run: npm install "@veamstudios/sap@${SAP_VERSION}"
        env:
          SAP_VERSION: ${{ github.event.client_payload.version }}

      - name: Create PR
        uses: actions/github-script@v8
        env:
          SAP_VERSION: ${{ github.event.client_payload.version }}
        with:
          github-token: ${{ steps.release_bot_token.outputs.token }}
          script: |
            const version = process.env.SAP_VERSION;
            const branch = `chore/update-sap-models-${version}`;
            await exec.exec('git', ['checkout', '-b', branch]);
            await exec.exec('git', ['add', '.']);
            await exec.exec('git', ['commit', '-m', `chore: update @veamstudios/sap to ${version}`]);
            await exec.exec('git', ['push', 'origin', branch]);
            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `chore: update SAP models to ${version}`,
              head: branch,
              base: 'main',
              body: `Auto-generated by SAP Models CI.\nUpdates \`@veamstudios/sap\` to \`${version}\`.`
            });

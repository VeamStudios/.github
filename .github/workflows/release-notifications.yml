name: Release Notifications

on:
  workflow_call:
    inputs:
      version:
        description: "Release version tag (e.g. v1.2.3)"
        required: true
        type: string
      environment:
        description: "Deployment environment (e.g. production)"
        required: true
        type: string
      beta_run_id:
        description: "Beta workflow run ID used as the promotion source"
        required: true
        type: string
      beta_run_url:
        description: "URL for the beta workflow run used as the promotion source"
        required: true
        type: string
      beta_commit_sha:
        description: "Commit SHA for the approved beta build"
        required: true
        type: string
      beta_version:
        description: "Approved beta version string"
        required: true
        type: string
      beta_build_number:
        description: "Approved beta build number"
        required: true
        type: string
      cloud_commit_sha:
        description: "Commit SHA for the released cloud build"
        required: true
        type: string
      cloud_version:
        description: "Released cloud version string"
        required: true
        type: string
      cloud_build_number:
        description: "Released cloud build number"
        required: true
        type: string
      changelog_git_ref:
        description: >-
          Git ref (commit SHA recommended) to checkout when reading CHANGELOG.md.
          When empty, the generic slack_footer_mrkdwn line is kept in the context block.
        required: false
        default: ""
        type: string
      slack_footer_mrkdwn:
        description: >-
          Fallback last context line when CHANGELOG.md is missing or has no section for this version.
          Omitted when a changelog excerpt is shown.
        required: false
        default: "Please inform any customers waiting on fixes in this release."
        type: string
    secrets:
      SLACK_RELEASES_WEBHOOK_URL:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (changelog)
        if: ${{ inputs.changelog_git_ref != '' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.changelog_git_ref }}
          fetch-depth: 0

      - name: Build Slack payload
        uses: VeamStudios/.github/.github/actions/slack-release-notify-payload@main
        with:
          variant: ios
          version: ${{ inputs.version }}
          environment: ${{ inputs.environment }}
          slack_footer_fallback: ${{ inputs.slack_footer_mrkdwn }}
          beta_run_id: ${{ inputs.beta_run_id }}
          beta_run_url: ${{ inputs.beta_run_url }}
          beta_commit_sha: ${{ inputs.beta_commit_sha }}
          beta_version: ${{ inputs.beta_version }}
          beta_build_number: ${{ inputs.beta_build_number }}
          cloud_commit_sha: ${{ inputs.cloud_commit_sha }}
          cloud_version: ${{ inputs.cloud_version }}
          cloud_build_number: ${{ inputs.cloud_build_number }}

      - name: Send Slack notification
        uses: slackapi/slack-github-action@v3.0.3
        with:
          webhook: ${{ secrets.SLACK_RELEASES_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: slack-payload.json

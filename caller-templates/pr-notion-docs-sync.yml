# PR Notion Docs Sync - Caller Workflow
#
# Copy this file into your repo's .github/workflows/ directory.
# It calls the central reusable workflow from the VeamStudios/.github repo.
#
# Manually trigger this workflow with a PR number to create/update
# a Notion Proposal page with PR context for documentation analysis.

name: PR Notion Docs Sync

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: "Pull request number to analyze"
        required: true
        type: string
      dry-run:
        description: "Build artifacts only without writing to Notion"
        required: false
        type: boolean
        default: false

jobs:
  notion-docs-sync:
    uses: VeamStudios/.github/.github/workflows/pr-notion-docs-sync.yml@main
    secrets:
      notion-token: ${{ secrets.NOTION_TOKEN }}
    # IMPORTANT: If you are not using the default VeamStudios Notion workspace/databases,
    # you must set the database URLs below to your own Notion databases and ensure
    # your NOTION_TOKEN integration is shared to those databases, or Notion will return 404.
    with:
      pr-number: ${{ inputs['pr-number'] }}
      dry-run: ${{ inputs['dry-run'] }}
    #   product-name-override: 'Checklist Inspector Pro'
    #   github-repos-db-url: 'https://www.notion.so/veamstudios/...'
    #   products-db-url: 'https://www.notion.so/veamstudios/...'
    #   proposals-db-url: 'https://www.notion.so/veamstudios/...'

name: Update Changelog Website

on:
  workflow_call:
    inputs:
      source_file:
        description: "Source changelog file in the caller repository"
        required: true
        type: string
      deployed_ref:
        description: "Git ref for the commit, branch, or tag being deployed"
        required: true
        type: string
      destination_repo:
        description: "Repository to receive the changelog copy"
        required: true
        type: string
      destination_folder:
        description: "Destination folder in the changelog repository"
        required: true
        type: string
      destination_file:
        description: 'Optional explicit destination basename (defaults to source basename)'
        type: string
        default: ''
      release_page:
        description: 'Required verified Notion release for Android publication'
        type: string
        default: ''
      version:
        description: "Version string used in the changelog sync commit message"
        required: true
        type: string
    secrets:
      NOTION_TOKEN:
        required: false
      BOT_RELEASE_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  android:
    if: ${{ github.repository == 'VeamStudios/SiteAuditPro-AndroidNew' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ vars.BOT_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.BOT_RELEASE_PRIVATE_KEY }}
          owner: VeamStudios
      - uses: actions/checkout@v6
        with:
          repository: VeamStudios/.github
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Publish only reviewed and verified Android notes
        run: node .github/actions/release-ledger/publish-play-website.js
        env:
          RELEASE_PAGE_ID: ${{ inputs.release_page }}
          SOURCE_FILE: ${{ inputs.source_file }}
          SOURCE_COMMIT: ${{ inputs.deployed_ref }}
          RELEASE_VERSION: ${{ inputs.version }}
          DESTINATION_REPO: ${{ inputs.destination_repo }}
          DESTINATION_FOLDER: ${{ inputs.destination_folder }}
          DESTINATION_FILE: ${{ inputs.destination_file }}
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
  update:
    if: ${{ github.repository != 'VeamStudios/SiteAuditPro-AndroidNew' }}
    name: Copy changelog to destination repo
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOT_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.BOT_RELEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout repository (default ref)
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.deployed_ref }}
          token: ${{ steps.app_token.outputs.token }}

      - name: Resolve commit message
        id: commit_message
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^v?[0-9]+(\.[0-9]+)+$ ]] || { echo "Invalid release version"; exit 1; }
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          MESSAGE="Update changelog for $RELEASE_VERSION"
          echo "value=$MESSAGE" >> "$GITHUB_OUTPUT"

      - name: Stage source changelog
        shell: bash
        env:
          SOURCE_FILE: ${{ inputs.source_file }}
        run: |
          set -euo pipefail

          if [ ! -f "$SOURCE_FILE" ]; then
            echo "::error::Source changelog not found: $SOURCE_FILE"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/changelog-sync"
          cp "$SOURCE_FILE" "$RUNNER_TEMP/changelog-sync/source-file"

      - name: Checkout destination repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.destination_repo }}
          ref: main
          path: changelog-destination
          token: ${{ steps.app_token.outputs.token }}

      - name: Commit changelog to destination
        shell: bash
        env:
          SOURCE_FILE: ${{ inputs.source_file }}
          DESTINATION_FOLDER: ${{ inputs.destination_folder }}
          DESTINATION_FILE: ${{ inputs.destination_file }}
          COMMIT_MESSAGE: ${{ steps.commit_message.outputs.value }}
          SOURCE_COMMIT: ${{ steps.commit_message.outputs.source_commit }}
        run: |
          set -euo pipefail

          case "$DESTINATION_FOLDER" in
            ""|/*|*../*|../*)
              echo "::error::destination_folder must be a relative folder inside the destination repository"
              exit 1
              ;;
          esac

          basename="${DESTINATION_FILE:-$(basename "$SOURCE_FILE")}"
          [[ "$basename" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "Invalid destination filename"; exit 1; }
          destination_file="changelog-destination/${DESTINATION_FOLDER}/${basename}"
          mkdir -p "$(dirname "$destination_file")"
          cp "$RUNNER_TEMP/changelog-sync/source-file" "$destination_file"

          cd changelog-destination
          git config user.email "180547681+veamstudios-release-bot[bot]@users.noreply.github.com"
          git config user.name "Release Bot"
          git add "${DESTINATION_FOLDER}/${basename}"

          if git diff --cached --quiet; then
            echo "No changelog changes to commit."
            exit 0
          fi

          git commit -m "$COMMIT_MESSAGE" -m "Release-Source-Repository: $GITHUB_REPOSITORY
          Release-Source-Commit: $SOURCE_COMMIT
          Release-Source-Path: $SOURCE_FILE"
          git push origin HEAD:main

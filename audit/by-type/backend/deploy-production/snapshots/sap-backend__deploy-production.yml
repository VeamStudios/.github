name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number for the release (e.g. 1.2.3)"
        required: true
        type: string
      release_notes:
        description: "Additional release notes (optional - prepended to auto-generated notes)"
        required: false
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Production
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      env: prod
      publish_dummy_data: true

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: deploy
    environment: prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.deploy.outputs.commit_sha }}
          fetch-depth: 1

      - name: Mint GitHub App token (Release Bot)
        id: release_bot_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_RELEASE_APP_ID }}
          private-key: ${{ secrets.BOT_RELEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Create GitHub Release
        run: |
          set -euo pipefail
          TAG_NAME="v${VERSION}"
          if [ -n "${RELEASE_NOTES}" ]; then
            printf '%s' "${RELEASE_NOTES}" | gh release create "$TAG_NAME" \
              --target "${DEPLOY_SHA}" \
              --title "$TAG_NAME" \
              --generate-notes \
              --notes-file -
          else
            gh release create "$TAG_NAME" \
              --target "${DEPLOY_SHA}" \
              --title "$TAG_NAME" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ steps.release_bot_token.outputs.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          DEPLOY_SHA: ${{ needs.deploy.outputs.commit_sha }}

  notify:
    name: Notify Release
    needs: [deploy, create-release]
    uses: ./.github/workflows/notify-release.yml
    with:
      version: v${{ inputs.version }}
      environment: production
    secrets: inherit

  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy, create-release, notify]
    if: always()
    steps:
      - name: Display Summary
        run: |
          echo "Deploy Production completed!"
          echo "Release: v${VERSION}"
          echo "Commit: ${DEPLOY_SHA}"
          echo "Release URL: ${SERVER_URL}/${REPO}/releases/tag/v${VERSION}"
        env:
          VERSION: ${{ inputs.version }}
          DEPLOY_SHA: ${{ needs.deploy.outputs.commit_sha }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}

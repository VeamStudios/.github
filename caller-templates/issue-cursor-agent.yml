# Issue Cursor Agent - Caller Workflow
#
# Copy this file into your repo's .github/workflows/ directory.
# It calls the central reusable workflow from the VeamStudios/.github repo.
#
# When the 'bot: fix' or 'bot: triage' label is added to an issue, this
# workflow runs the shared Cursor issue agent automation.

name: Issue Bot

on:
  issues:
    types: [labeled]

jobs:
  cursor-agent:
    if: "${{ github.event.label.name == 'bot: fix' || github.event.label.name == 'bot: triage' }}"
    uses: VeamStudios/.github/.github/workflows/issue-cursor-agent.yml@main
    with:
      github-app-id: ${{ vars.BOT_CURSOR_APP_ID }}

      # Uncomment and customize inputs as needed:
      # setup-command: npm ci
      # test-command: npm test -- --runInBand
      # extra-prompt: |
      #   This repository uses npm.
      #   Keep changes minimal and reviewer-friendly.
      # fix-label: bot: fix
      # triage-label: bot: triage
      # branch-prefix: cursor/issue
      # cursor-model: gpt-5.2
      # post-start-comment: true
    secrets:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      GITHUB_APP_PRIVATE_KEY: ${{ secrets.BOT_CURSOR_PRIVATE_KEY }}

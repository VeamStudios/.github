name: Record Work Item merge evidence
on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
    secrets:
      BOT_RELEASE_PRIVATE_KEY:
        required: true
      NOTION_TOKEN:
        required: true
permissions:
  contents: read
  pull-requests: read
jobs:
  complete:
    runs-on: ubuntu-latest
    # Replaces the shared ledger lock: overlapping merges in one repository could
    # otherwise both create the same Work Item's automation-state row. GitHub
    # releases the group if a run is cancelled.
    concurrency:
      group: release-ledger-development-${{ github.repository }}
      cancel-in-progress: false
    steps:
      # No caller checkout or PR code runs in this privileged workflow.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ vars.BOT_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.BOT_RELEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: VeamStudios/.github/.github/actions/complete-work-item-development@main
        with:
          pr_number: ${{ inputs.pr_number }}
          github_token: ${{ steps.token.outputs.token }}
          notion_token: ${{ secrets.NOTION_TOKEN }}
          mode: live
          lifecycle_writes: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-completion-${{ inputs.pr_number }}-${{ github.run_attempt }}
          path: development-completion.json
          if-no-files-found: warn

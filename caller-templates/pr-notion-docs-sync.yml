# PR Notion Docs Sync — caller workflow (copy into your repo's .github/workflows/)
#
# Triggers on pull_request and workflow_dispatch (manual PR number + optional dry-run).
# Calls VeamStudios/.github/.github/workflows/pr-notion-docs-sync.yml@main.
#
# Requirements:
# - Secret NOTION_TOKEN (passed as notion-token).
# - Permission models: read so the reusable workflow can call actions/ai-inference (GitHub Models) for the doc brief.
# Secrets are not available for pull_request runs from forks; use same-repo PRs or adjust policy.
# Database URLs / Notion API version: edit only in the reusable workflow in this repo:
#   VeamStudios/.github/.github/workflows/pr-notion-docs-sync.yml

name: PR Notion Docs Sync

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      pr-number:
        description: "Pull request number in this repository to sync to Notion"
        required: true
        type: string
      dry-run:
        description: "Log only; do not write to Notion"
        required: false
        type: boolean
        default: false

concurrency:
  group: notion-docs-${{ github.repository }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs['pr-number'] || github.run_id }}
  cancel-in-progress: true

jobs:
  sync_pr_to_notion:
    # Manual runs always; on pull_request skip drafts unless you remove the event check.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    #
    # Optional: only run when the PR has a specific label (uncomment and adjust):
    # if: github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'docs-notion')

    permissions:
      contents: read
      pull-requests: read
      models: read

    uses: VeamStudios/.github/.github/workflows/pr-notion-docs-sync.yml@main
    secrets:
      notion-token: ${{ secrets.NOTION_TOKEN }}
    with:
      pr-number: ${{ github.event_name == 'workflow_dispatch' && inputs['pr-number'] || github.event.pull_request.number }}
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs['dry-run'] || false }}
      # use-ai-inference: true
      # ai-model: openai/gpt-4.1
      # max-tokens: 3500
      # Excerpt Swift models from this repo for the AI brief (default matches CIP iOS layout):
      # app-models-excerpt-path: iOS App/Data/Models
      data-models-path-hint: Data/Models

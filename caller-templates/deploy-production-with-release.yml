# Deploy Production with Release + Notification - Caller Workflow Template
#
# Copy this file into your repo's .github/workflows/ directory and
# customise the deploy job to call your repo's _deploy.yml.
#
# Creates a GitHub release after deploy and sends a Slack notification.
# Both the release and notification use shared workflows from VeamStudios/.github.

name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number for the release (e.g. 1.2.3)"
        required: true
        type: string
      release_notes:
        description: "Additional release notes (optional)"
        required: false
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Production
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      env: prod

  create-release:
    name: Create GitHub Release
    needs: deploy
    uses: VeamStudios/.github/.github/workflows/create-github-release.yml@main
    with:
      version: ${{ inputs.version }}
      deploy_sha: ${{ needs.deploy.outputs.commit_sha }}
      release_notes: ${{ inputs.release_notes }}
      environment: prod
    secrets:
      BOT_RELEASE_PRIVATE_KEY: ${{ secrets.BOT_RELEASE_PRIVATE_KEY }}

  notify:
    name: Notify Release
    needs: [deploy, create-release]
    uses: VeamStudios/.github/.github/workflows/notify-release.yml@main
    with:
      version: v${{ inputs.version }}
      environment: production
    secrets:
      SLACK_RELEASES_WEBHOOK_URL: ${{ secrets.SLACK_RELEASES_WEBHOOK_URL }}

name: Hotfix Deploy

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Hotfix PR number created by Hotfix Prepare"
        required: true
        type: string
      expected_version:
        description: "Prepared hotfix marketing version from Hotfix Prepare (for example 8.26.2)"
        required: true
        type: string
      release_notes:
        description: "Additional release notes for deploy"
        required: false
        type: string
      sync_changelog_website:
        description: "Copy CHANGELOG.md to the website repo after deploy"
        required: false
        type: boolean
        default: true

jobs:
  deploy-hotfix:
    uses: VeamStudios/.github/.github/workflows/hotfix-deploy.yml@main
    with:
      pr_number: ${{ inputs.pr_number }}
      expected_version: ${{ inputs.expected_version }}
      release_notes: ${{ inputs.release_notes }}
      ipa_path: "./fastlane/builds/com.veamstudios.checklistinspectorpro.ipa"
      archive_name_prefix: "ChecklistInspectorPro"
      changelog_destination_repo: ${{ inputs.sync_changelog_website && 'VeamStudios/checklistinspectorpro.com' || '' }}
      changelog_destination_folder: ${{ inputs.sync_changelog_website && 'src/assets/changelog-ios' || '' }}
      confirm_deploy_from_pr_head: true
    secrets: inherit

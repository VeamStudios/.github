name: Evaluate Changelog Entry Assessment
on:
  workflow_call:
    secrets:
      CURSOR_API_KEY:
        required: true
permissions:
  contents: read
jobs:
  synthetic:
    name: Synthetic cases
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Evaluate three public synthetic policy cases
        uses: VeamStudios/.github/.github/actions/check-changelog-entry@905d15b5b317b7752330f61a90d5cdf5354e6b99
        with:
          assessment-mode: synthetic-evaluation
          repository: ${{ github.repository }}
          head: ${{ github.event.pull_request.head.sha }}
          base: ${{ github.event.pull_request.base.sha }}
          cursor-api-key: ${{ secrets.CURSOR_API_KEY }}

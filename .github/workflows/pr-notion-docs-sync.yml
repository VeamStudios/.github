name: PR Notion Docs Sync

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: "Pull request number to analyze"
        required: true
        type: string
      max-diff-bytes:
        description: "Maximum diff bytes captured from PR"
        required: false
        type: number
        default: 45000
      max-diff-chars-in-proposal:
        description: "Max diff characters embedded into Notion proposal request"
        required: false
        type: number
        default: 12000
      max-changed-files-in-proposal:
        description: "Max changed files listed in Notion proposal request"
        required: false
        type: number
        default: 200
      notion-version:
        description: "Notion API version header"
        required: false
        type: string
        default: "2022-06-28"
      github-repos-db-url:
        description: "Notion URL or ID for GitHub Repos database"
        required: false
        type: string
        default: "https://www.notion.so/veamstudios/7657c233579e40909b9cf1640e4904f8"
      products-db-url:
        description: "Notion URL or ID for Products database"
        required: false
        type: string
        default: "https://www.notion.so/veamstudios/30c069083a03803e9636f97345e2d433"
      proposals-db-url:
        description: "Notion URL or ID for Proposals database"
        required: false
        type: string
        default: "https://www.notion.so/veamstudios/2ca691667ea34ddfabee572644ce8290"
      product-name-override:
        description: "Optional Product name override if repo mapping is unavailable"
        required: false
        type: string
        default: ""
      dry-run:
        description: "Build proposal request context without writing to Notion"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      pr-number:
        description: "Optional PR number override"
        required: false
        type: number
      max-diff-bytes:
        description: "Maximum diff bytes captured from PR"
        required: false
        type: number
        default: 45000
      max-diff-chars-in-proposal:
        description: "Max diff characters embedded into Notion proposal request"
        required: false
        type: number
        default: 12000
      max-changed-files-in-proposal:
        description: "Max changed files listed in Notion proposal request"
        required: false
        type: number
        default: 200
      notion-version:
        description: "Notion API version header"
        required: false
        type: string
        default: "2022-06-28"
      github-repos-db-url:
        description: "Notion URL or ID for GitHub Repos database"
        required: false
        type: string
        default: "https://www.notion.so/veamstudios/7657c233579e40909b9cf1640e4904f8"
      products-db-url:
        description: "Notion URL or ID for Products database"
        required: false
        type: string
        default: "https://www.notion.so/veamstudios/30c069083a03803e9636f97345e2d433"
      proposals-db-url:
        description: "Notion URL or ID for Proposals database"
        required: false
        type: string
        default: "https://www.notion.so/veamstudios/2ca691667ea34ddfabee572644ce8290"
      product-name-override:
        description: "Optional Product name override if repo mapping is unavailable"
        required: false
        type: string
        default: ""
      dry-run:
        description: "Build proposal request context without writing to Notion"
        required: false
        type: boolean
        default: false
    secrets:
      notion-token:
        description: "Notion integration token"
        required: true

jobs:
  notion-doc-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve IDs and PR metadata
        id: meta
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs['pr-number'] || github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_GITHUB_REPOS_DB_URL: ${{ inputs.github-repos-db-url }}
          INPUT_PRODUCTS_DB_URL: ${{ inputs.products-db-url }}
          INPUT_PROPOSALS_DB_URL: ${{ inputs.proposals-db-url }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys

          def extract_db_id(value: str) -> str:
            if not value:
              return ""
            # First try canonical UUID (with dashes)
            m = re.search(r'([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})', value)
            if m:
              return m.group(1).replace("-", "")
            # Then compact 32-char IDs used in notion URLs
            m = re.search(r'([0-9a-fA-F]{32})', value)
            if m:
              return m.group(1).lower()
            return ""

          required = {
            "github_repos_db_id": extract_db_id(os.getenv("INPUT_GITHUB_REPOS_DB_URL", "")),
            "products_db_id": extract_db_id(os.getenv("INPUT_PRODUCTS_DB_URL", "")),
            "proposals_db_id": extract_db_id(os.getenv("INPUT_PROPOSALS_DB_URL", "")),
          }

          missing = [k for k, v in required.items() if not v and k in ("github_repos_db_id", "products_db_id", "proposals_db_id")]
          if missing:
            print(f"Missing required Notion database IDs: {', '.join(missing)}", file=sys.stderr)
            sys.exit(1)

          repository = os.getenv("GITHUB_REPOSITORY", "")
          if "/" not in repository:
            print("This workflow must run in a repository context.", file=sys.stderr)
            sys.exit(1)
          owner, repo_name = repository.split("/", 1)

          payload = {
            "repo_owner": owner,
            "repo_name": repo_name,
            "pr_number": os.getenv("PR_NUMBER", ""),
            "pr_url": os.getenv("PR_URL", ""),
            "pr_title": os.getenv("PR_TITLE", ""),
            "pr_body": os.getenv("PR_BODY", "") or "",
            "pr_sha": os.getenv("PR_SHA", ""),
            **required,
          }
          if not str(payload["pr_number"]).strip():
            print("PR number is required. Provide inputs.pr-number for manual runs.", file=sys.stderr)
            sys.exit(1)
          with open("meta.json", "w", encoding="utf-8") as f:
            json.dump(payload, f, indent=2)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
            for key, val in payload.items():
              if key == "pr_body":
                continue
              out.write(f"{key}={str(val).replace(chr(10), ' ')}\n")
          PY

      - name: Collect PR diff and changed files
        id: pr_context
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.meta.outputs.pr_number }}
          MAX_DIFF_BYTES: ${{ inputs.max-diff-bytes }}
          MAX_DIFF_CHARS_IN_PROPOSAL: ${{ inputs.max-diff-chars-in-proposal }}
          MAX_CHANGED_FILES_IN_PROPOSAL: ${{ inputs.max-changed-files-in-proposal }}
        run: |
          gh pr view "$PR_NUMBER" --json files,headRefOid,url,title,body > pr_view.json
          gh pr diff "$PR_NUMBER" > pr_diff_raw.txt || true

          python - <<'PY'
          import json
          import os

          with open("pr_view.json", "r", encoding="utf-8") as f:
            data = json.load(f)
          pr_url = data.get("url", "")
          pr_title = data.get("title", "")
          pr_body = data.get("body", "") or ""
          pr_sha = data.get("headRefOid", "")
          paths = [f.get("path", "") for f in data.get("files", []) if f.get("path")]
          with open("changed_files.txt", "w", encoding="utf-8") as f:
            f.write("\n".join(paths))

          max_bytes = int(os.getenv("MAX_DIFF_BYTES", "45000"))
          raw = open("pr_diff_raw.txt", "rb").read()
          trimmed = raw[:max_bytes]
          with open("pr_diff.txt", "wb") as f:
            f.write(trimmed)

          max_diff_chars = int(os.getenv("MAX_DIFF_CHARS_IN_PROPOSAL", "12000"))
          max_changed_files = int(os.getenv("MAX_CHANGED_FILES_IN_PROPOSAL", "200"))
          diff_text = trimmed.decode("utf-8", "replace")
          diff_excerpt = diff_text[:max_diff_chars]
          max_pr_body_chars = 4000
          compact = {
            "schema_version": "1",
            "pr": {
              "url": pr_url,
              "title": pr_title,
              "body": pr_body[:max_pr_body_chars],
              "body_truncated": len(pr_body) > max_pr_body_chars,
              "head_sha": pr_sha,
            },
            "changed_files": paths[:max_changed_files],
            "changed_files_total": len(paths),
            "diff_excerpt": diff_excerpt,
            "diff_excerpt_truncated": len(diff_text) > len(diff_excerpt),
          }
          with open("pr_context_compact.json", "w", encoding="utf-8") as f:
            json.dump(compact, f, indent=2, ensure_ascii=False)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
            out.write(f"pr_url={str(pr_url).replace(chr(10), ' ')}\n")
            out.write(f"pr_title={str(pr_title).replace(chr(10), ' ')}\n")
            out.write(f"pr_sha={str(pr_sha).replace(chr(10), ' ')}\n")
          PY

      - name: Resolve product mapping
        id: catalog
        env:
          NOTION_TOKEN: ${{ secrets.notion-token }}
          NOTION_VERSION: ${{ inputs.notion-version }}
          PRODUCT_NAME_OVERRIDE: ${{ inputs.product-name-override }}
          GITHUB_REPOS_DB_ID: ${{ steps.meta.outputs.github_repos_db_id }}
          PRODUCTS_DB_ID: ${{ steps.meta.outputs.products_db_id }}
          REPO_NAME: ${{ steps.meta.outputs.repo_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["NOTION_TOKEN"]
          notion_version = os.environ["NOTION_VERSION"]

          def notion_request(method, path, payload):
            req = urllib.request.Request(
              f"https://api.notion.com{path}",
              data=json.dumps(payload).encode("utf-8"),
              method=method,
              headers={
                "Authorization": f"Bearer {token}",
                "Content-Type": "application/json",
                "Notion-Version": notion_version,
              },
            )
            try:
              with urllib.request.urlopen(req) as r:
                return json.loads(r.read().decode("utf-8"))
            except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", "replace")
              hint = ""
              if e.code == 404 and "/databases/" in path:
                hint = " Ensure the database URL/ID is correct and the Notion integration has access to that database."
              raise RuntimeError(f"Notion API {method} {path} failed with HTTP {e.code}: {body}.{hint}") from e

          def notion_post(path, payload):
            return notion_request("POST", path, payload)

          repo_name = os.environ["REPO_NAME"]
          repo_db_id = os.environ["GITHUB_REPOS_DB_ID"]
          products_db_id = os.environ["PRODUCTS_DB_ID"]

          # Resolve repo -> product tag from GitHub Repos database.
          repo_query = notion_post(
            f"/v1/databases/{repo_db_id}/query",
            {
              "filter": {
                "property": "Name",
                "title": {
                  "equals": repo_name
                }
              },
              "page_size": 5,
            },
          )
          repo_rows = repo_query.get("results", [])
          product_name = os.environ.get("PRODUCT_NAME_OVERRIDE", "").strip()
          if not product_name and repo_rows:
            products_prop = repo_rows[0]["properties"].get("Products", {})
            names = [x.get("name", "") for x in products_prop.get("multi_select", []) if x.get("name")]
            if names:
              product_name = names[0]

          if not product_name:
            raise RuntimeError(
              f"Unable to resolve product for repo '{repo_name}'. Provide product-name-override or update GitHub Repos mapping."
            )

          product_query = notion_post(
            f"/v1/databases/{products_db_id}/query",
            {
              "filter": {
                "property": "Product name",
                "title": {
                  "equals": product_name
                }
              },
              "page_size": 5,
            },
          )
          product_results = product_query.get("results", [])
          if not product_results:
            raise RuntimeError(f"Product '{product_name}' not found in Products database.")

          product_page = product_results[0]
          product_page_id = product_page["id"]

          product_norm = product_name.lower()
          if "checklist inspector" in product_norm or "cip" in product_norm:
            product_family = "CIP"
          elif "site audit" in product_norm or "sap" in product_norm:
            product_family = "SAP"
          else:
            product_family = "CIP"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
            out.write(f"product_name={product_name}\n")
            out.write(f"product_page_id={product_page_id}\n")
            out.write(f"product_family={product_family}\n")
          PY

      - name: Upload proposal request artifacts
        uses: actions/upload-artifact@v4
        with:
          name: notion-proposal-request-pr-${{ steps.meta.outputs.pr_number }}
          path: |
            meta.json
            pr_context_compact.json
            changed_files.txt
            pr_diff.txt
          retention-days: 7

      - name: Create or update Proposal Request in Notion
        if: ${{ !inputs['dry-run'] }}
        env:
          NOTION_TOKEN: ${{ secrets.notion-token }}
          NOTION_VERSION: ${{ inputs.notion-version }}
          PROPOSALS_DB_ID: ${{ steps.meta.outputs.proposals_db_id }}
          PR_URL: ${{ steps.pr_context.outputs.pr_url }}
          PR_NUMBER: ${{ steps.meta.outputs.pr_number }}
          PR_TITLE: ${{ steps.pr_context.outputs.pr_title }}
          PR_SHA: ${{ steps.pr_context.outputs.pr_sha }}
          PRODUCT_PAGE_ID: ${{ steps.catalog.outputs.product_page_id }}
          PRODUCT_FAMILY: ${{ steps.catalog.outputs.product_family }}
          PRODUCT_NAME: ${{ steps.catalog.outputs.product_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["NOTION_TOKEN"]
          notion_version = os.environ["NOTION_VERSION"]

          def notion_request(method, path, payload):
            req = urllib.request.Request(
              f"https://api.notion.com{path}",
              data=json.dumps(payload).encode("utf-8"),
              method=method,
              headers={
                "Authorization": f"Bearer {token}",
                "Content-Type": "application/json",
                "Notion-Version": notion_version,
              },
            )
            try:
              with urllib.request.urlopen(req) as r:
                return json.loads(r.read().decode("utf-8"))
            except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", "replace")
              hint = ""
              if e.code == 404 and "/databases/" in path:
                hint = " Ensure the database URL/ID is correct and the Notion integration has access to that database."
              raise RuntimeError(f"Notion API {method} {path} failed with HTTP {e.code}: {body}.{hint}") from e

          def notion_post(path, payload):
            return notion_request("POST", path, payload)

          def notion_patch(path, payload):
            return notion_request("PATCH", path, payload)

          def heading_block(text):
            return {"object": "block", "type": "heading_3", "heading_3": {"rich_text": [{"type": "text", "text": {"content": text}}]}}

          def paragraph_block(text):
            return {"object": "block", "type": "paragraph", "paragraph": {"rich_text": [{"type": "text", "text": {"content": text[:1800]}}]}}

          def todo_block(text):
            return {"object": "block", "type": "to_do", "to_do": {"checked": False, "rich_text": [{"type": "text", "text": {"content": text[:1800]}}]}}

          def code_block(text, language="plain text"):
            return {
              "object": "block",
              "type": "code",
              "code": {
                "language": language,
                "rich_text": [{"type": "text", "text": {"content": text[:1800]}}],
              },
            }

          def chunk_text(text, size=1700):
            text = text or ""
            return [text[i:i + size] for i in range(0, len(text), size)] or [""]

          compact = json.load(open("pr_context_compact.json", "r", encoding="utf-8"))

          changed_files = open("changed_files.txt", "r", encoding="utf-8").read().splitlines()
          areas = set()
          for path in changed_files:
            p = path.lower()
            if p.endswith(".swift") or "/ios/" in p:
              areas.add("iOS")
            if any(p.endswith(x) for x in (".js", ".jsx", ".ts", ".tsx", ".css", ".scss", ".html")) or "/web/" in p:
              areas.add("Web")
            if "/backend/" in p or "/server/" in p or p.endswith(".py") or p.endswith(".go") or p.endswith(".java"):
              areas.add("Backend")
          if not areas:
            areas = {"Backend"}

          pr_url = os.environ["PR_URL"]
          pr_number = os.environ["PR_NUMBER"]
          pr_title = os.environ["PR_TITLE"]
          pr_sha = os.environ["PR_SHA"]
          product_name = os.environ["PRODUCT_NAME"]
          product_page_id = os.environ["PRODUCT_PAGE_ID"]
          proposals_db_id = os.environ["PROPOSALS_DB_ID"]

          summary = "PR context prepared for documentation impact analysis."

          properties = {
            "Proposal": {"title": [{"text": {"content": f"PR #{pr_number} - {pr_title}"}}]},
            "Status": {"status": {"name": "Raw Data"}},
            "PR URL": {"url": pr_url},
            "Summary": {"rich_text": [{"text": {"content": summary}}]},
            "Product": {"relation": [{"id": product_page_id}]},
            "Doc Areas": {"multi_select": [{"name": area} for area in sorted(areas)]},
          }

          # Idempotency key: PR URL. Upsert existing proposal page.
          existing = notion_post(
            f"/v1/databases/{proposals_db_id}/query",
            {
              "filter": {
                "property": "PR URL",
                "url": {"equals": pr_url}
              },
              "page_size": 1,
            },
          ).get("results", [])

          blocks = [
            heading_block("PR Context"),
            paragraph_block(f"PR: {pr_url}"),
            paragraph_block(f"Product: {product_name}"),
            paragraph_block(f"Product family: {os.environ['PRODUCT_FAMILY']}"),
            paragraph_block(f"Head SHA: {pr_sha}"),
            heading_block("Agent task"),
            paragraph_block("Analyze this PR context and propose concrete documentation updates in Notion."),
            paragraph_block("System prompt source: .github/prompts/notion-doc-proposal-agent-system-prompt.md"),
            todo_block("Identify impacted existing docs and any new docs that should be created"),
            todo_block("For each target, add why, suggested edits, PR evidence, and acceptance criteria"),
            todo_block("After proposal content is ready, set Status to Proposed"),
            heading_block("Changed files snapshot"),
          ]

          for path in compact.get("changed_files", [])[:40]:
            blocks.append(paragraph_block(f"- {path}"))
          if compact.get("changed_files_total", 0) > len(compact.get("changed_files", [])):
            blocks.append(paragraph_block(
              f"(truncated list) total changed files: {compact.get('changed_files_total', 0)}"
            ))

          blocks.append(heading_block("Diff excerpt snapshot"))
          diff_excerpt = compact.get("diff_excerpt", "")
          if not diff_excerpt:
            blocks.append(paragraph_block("No diff excerpt available."))
          else:
            for chunk in chunk_text(diff_excerpt)[:4]:
              blocks.append(code_block(chunk, "plain text"))
            if len(chunk_text(diff_excerpt)) > 4:
              blocks.append(paragraph_block("Diff excerpt truncated for Notion page size limits."))

          blocks.append(heading_block("Machine-readable request payload"))
          compact_json = json.dumps(compact, indent=2, ensure_ascii=False)
          payload_preview = compact_json[:10000]
          for chunk in chunk_text(payload_preview):
            blocks.append(code_block(chunk, "json"))
          if len(compact_json) > len(payload_preview):
            blocks.append(paragraph_block("Payload JSON truncated for Notion page size limits. Full payload is in workflow artifacts."))

          blocks.extend([
            heading_block("Review checklist"),
            todo_block("Validate proposed targets against changed code"),
            todo_block("Confirm acceptance criteria are concrete and testable"),
            todo_block("Set Status to Proposed after proposal draft is complete"),
            todo_block("A team member sets Status to Approved or Rejected"),
          ])

          if existing:
            page_id = existing[0]["id"]
            notion_patch(f"/v1/pages/{page_id}", {"properties": properties})
            notion_patch(f"/v1/blocks/{page_id}/children", {"children": blocks})
            print(f"Updated existing Proposal page: {page_id}")
          else:
            notion_post(
              "/v1/pages",
              {
                "parent": {"database_id": proposals_db_id},
                "properties": properties,
                "children": blocks,
              },
            )
            print("Created new Proposal page.")
          PY

      - name: Dry-run artifacts
        if: ${{ inputs['dry-run'] }}
        run: |
          echo "Dry run enabled. Proposal request payload:"
          cat pr_context_compact.json
          echo ""
          echo "Changed files:"
          wc -l changed_files.txt

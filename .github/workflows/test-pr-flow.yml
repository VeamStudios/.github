name: Test PR Flow
on:
  pull_request:
    paths:
      - '.github/actions/pr-flow/**'
      - '.github/actions/release-ledger/work-item-*.js'
      - '.github/workflows/pr-flow.yml'
      - '.github/workflows/test-pr-flow.yml'
      - 'docs/pr-flow/**'
  push:
    branches: [main]
    paths:
      - '.github/actions/pr-flow/**'
      - '.github/actions/release-ledger/work-item-*.js'
      - '.github/workflows/pr-flow.yml'
      - '.github/workflows/test-pr-flow.yml'
      - 'docs/pr-flow/**'
permissions:
  contents: read
jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Test check aggregation and rollout safeguards
        run: node --test .github/actions/pr-flow/*.test.js

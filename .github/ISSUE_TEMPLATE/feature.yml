name: ✨ Feature request
description: A new capability or a meaningful improvement.
type: "feature"
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's painful today, and for whom.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen. Rough is fine — we'll refine together.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Mockups, links, alternatives considered, anything else useful.
    validations:
      required: false

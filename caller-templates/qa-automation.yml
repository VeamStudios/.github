# QA Automation - Caller Workflow
#
# Copy this file into your repo's .github/workflows/ directory.
# It calls the central reusable workflow from the VeamStudios/.github repo.
#
# When the 'bot: qa needed' label is added to a PR, this workflow generates
# an AI-powered QA brief and posts it as a PR comment.
#
# The app name and platform are auto-detected from the repo name by default.
# Use the 'with' block below to override if your repo name doesn't follow
# the standard naming convention (e.g., AppName-Platform).

name: QA Automation

on:
  pull_request:
    types: [labeled]

jobs:
  qa-brief:
    if: "github.event.label.name == 'bot: qa needed'"
    uses: VeamStudios/.github/.github/workflows/qa-automation.yml@main
    # Uncomment and customise inputs as needed:
    # with:
    #   app-name: 'My Custom App'
    #   platform: 'iOS/iPadOS'    # Options: iOS/iPadOS, Android, Web
    #   ai-model: 'openai/gpt-4.1-mini'
    #   max-tokens: 2000

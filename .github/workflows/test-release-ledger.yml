name: Test Release Ledger
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/release-ledger/**'
      - '.github/actions/remote-config-notion-sync/**'
      - '.github/workflows/reconcile-google-play.yml'
      - '.github/workflows/update-changelog-website.yml'
      - '.github/actions/release-marker/**'
      - '.github/actions/verify-cloud-run/**'
      - '.github/actions/verify-functions/**'
      - '.github/actions/complete-work-item-development/**'
      - '.github/workflows/complete-work-item-development.yml'
      - '.github/workflows/qa-pipeline.yml'
      - '.github/workflows/*release*.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/release-ledger/**'
      - '.github/actions/remote-config-notion-sync/**'
      - '.github/workflows/reconcile-google-play.yml'
      - '.github/workflows/update-changelog-website.yml'
      - '.github/actions/release-marker/**'
      - '.github/actions/verify-cloud-run/**'
      - '.github/actions/verify-functions/**'
      - '.github/actions/complete-work-item-development/**'
      - '.github/workflows/complete-work-item-development.yml'
      - '.github/workflows/qa-pipeline.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node --test .github/actions/release-ledger/*.test.js .github/actions/remote-config-notion-sync/*.test.js
      - run: python3 -m unittest discover -s .github/actions/verify-functions -p 'test_*.py'

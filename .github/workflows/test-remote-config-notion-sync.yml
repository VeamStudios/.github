name: Test Remote Config → Notion Sync
on:
  pull_request:
    paths:
      - '.github/actions/remote-config-notion-sync/**'
      - '.github/workflows/remote-config-notion-sync.yml'
      - '.github/workflows/ios-app-store-live-monitor.yml'
      - '.github/workflows/test-remote-config-notion-sync.yml'
  push:
    branches: [main]
    paths:
      - '.github/actions/remote-config-notion-sync/**'
      - '.github/workflows/remote-config-notion-sync.yml'
      - '.github/workflows/ios-app-store-live-monitor.yml'
      - '.github/workflows/test-remote-config-notion-sync.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node .github/actions/remote-config-notion-sync/sync.test.js
      # Load the actual composite manifest in GitHub's runner. No credentials are
      # provided, so the smoke test cannot read or write production data.
      - name: Load composite action without production credentials
        id: smoke
        uses: ./.github/actions/remote-config-notion-sync
        with:
          product: cip
          dry_run: 'true'
      - name: Check smoke-test outputs
        env:
          MATCHED: ${{ steps.smoke.outputs.matched_pages }}
          UPDATED: ${{ steps.smoke.outputs.updated_pages }}
          CHECKED: ${{ steps.smoke.outputs.remote_config_checked }}
        run: test "$MATCHED" = 0 && test "$UPDATED" = 0 && test "$CHECKED" = 0
      # Only this negative test tolerates failure, then asserts the action failed.
      - name: Requested sync must fail without credentials
        id: missing-credentials
        continue-on-error: true
        uses: ./.github/actions/remote-config-notion-sync
        with:
          product: cip
          firebase_project_id: test-project
          dry_run: 'true'
      - name: Check configuration failure is visible
        env:
          OUTCOME: ${{ steps.missing-credentials.outcome }}
        run: test "$OUTCOME" = failure

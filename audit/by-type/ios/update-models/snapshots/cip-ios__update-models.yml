name: Update CIP Models

on:
  repository_dispatch:
    types: [cip-models-update]

jobs:
  update:
    permissions:
      contents: write
      pull-requests: write
    uses: VeamStudios/.github/.github/workflows/pr-spm-package-update.yml@main
    with:
      version: ${{ github.event.client_payload.version }}
      package_repo_url: https://github.com/VeamStudios/ChecklistInspectorPro
      xcode_scheme: Dev
      base_branch: main
      branch_prefix: chore/update-cip-models-
      commit_subject: "chore: update CIP Models to ${{ github.event.client_payload.version }}"
      pr_title: "chore: update CIP Models to ${{ github.event.client_payload.version }}"
      pr_body: "Auto-generated by CIP-Models CI.\nUpdates CIP Models SPM package to `${{ github.event.client_payload.version }}`."
    secrets: inherit

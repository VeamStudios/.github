name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number for the release (e.g. 1.2.3)"
        required: true
        type: string
      release_notes:
        description: "Additional release notes (optional — added to auto-generated notes)"
        required: false
        type: string

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Production
    uses: ./.github/workflows/_deploy.yml
    with:
      deployment_environment: prod
      build_script: build
      firebase_project: site-audit-pro
      service_account_file: sa-prod.json
      firebase_config_file: firebase-prod.json
    secrets:
      SERVICE_ACCOUNT_BASE64: ${{ secrets.SERVICE_ACCOUNT_BASE64 }}
      BOT_RELEASE_PRIVATE_KEY: ${{ secrets.BOT_RELEASE_PRIVATE_KEY }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: deploy
    environment: prod
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.deploy.outputs.commit_sha }}
          fetch-depth: 1

      - name: Mint GitHub App token (Release Bot)
        id: release_bot_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_RELEASE_APP_ID }}
          private-key: ${{ secrets.BOT_RELEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Mint GitHub App token (Release Bot for changelog website)
        id: release_bot_changelog_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_RELEASE_APP_ID }}
          private-key: ${{ secrets.BOT_RELEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            siteauditpro.com

      - name: Create GitHub Release
        run: |
          TAG_NAME="v${VERSION}"
          if [ -n "${RELEASE_NOTES}" ]; then
            gh release create "$TAG_NAME" \
              --target "${DEPLOY_SHA}" \
              --title "$TAG_NAME" \
              --generate-notes \
              --notes "${RELEASE_NOTES}"
          else
            gh release create "$TAG_NAME" \
              --target "${DEPLOY_SHA}" \
              --title "$TAG_NAME" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ steps.release_bot_token.outputs.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          DEPLOY_SHA: ${{ needs.deploy.outputs.commit_sha }}

      - name: Update Changelog Website
        uses: dmnemec/copy_file_to_another_repo_action@v1.1.1
        env:
          API_TOKEN_GITHUB: ${{ steps.release_bot_changelog_token.outputs.token }}
        with:
          source_file: "CHANGELOG.md"
          destination_repo: "VeamStudios/siteauditpro.com"
          destination_folder: "src/app/content/changelogs/web"
          destination_branch: "main"
          user_email: "180547681+veamstudios-release-bot[bot]@users.noreply.github.com"
          user_name: "Release Bot"
          commit_message: "Update Site Audit Pro web changelog for v${{ inputs.version }}"

  notify:
    name: Notify Release
    needs: [deploy, create-release]
    uses: ./.github/workflows/notify-release.yml
    with:
      version: v${{ inputs.version }}
      environment: production
    secrets:
      SLACK_RELEASES_WEBHOOK_URL: ${{ secrets.SLACK_RELEASES_WEBHOOK_URL }}

  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy, create-release, notify]
    if: always()
    steps:
      - name: Display Summary
        run: |
          echo "🎉 Deploy Production completed!"
          echo "📦 Release: v${VERSION}"
          echo "📍 Commit: ${DEPLOY_SHA}"
          echo "✅ Release URL: ${SERVER_URL}/${REPO}/releases/tag/v${VERSION}"
        env:
          VERSION: ${{ inputs.version }}
          DEPLOY_SHA: ${{ needs.deploy.outputs.commit_sha }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
name: Changelog format and links
description: Check exact-head CHANGELOG.md structure and link syntax without executing PR code.
inputs:
  repository:
    description: Repository whose changelog is checked
    required: true
  head:
    description: Exact reviewed PR head SHA
    required: true
  base:
    description: Current PR base SHA
    required: true
runs:
  using: composite
  steps:
    - name: Check changelog format and links
      shell: bash
      env:
        CHANGELOG_SCRIPT: ${{ github.action_path }}/../release-ledger/check-changelog.js
        CHANGELOG_WORKSPACE: ${{ github.workspace }}
        CHANGELOG_REPOSITORY: ${{ inputs.repository }}
        CHANGELOG_HEAD_SHA: ${{ inputs.head }}
        CHANGELOG_BASE_SHA: ${{ inputs.base }}
      run: node "$CHANGELOG_SCRIPT"

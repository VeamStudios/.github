name: Update Changelog Website

on:
  workflow_call:
    inputs:
      source_file:
        description: "Source changelog file in the caller repository"
        required: true
        type: string
      deployed_ref:
        description: "Git ref for the commit, branch, or tag being deployed"
        required: true
        type: string
      destination_repo:
        description: "Repository to receive the changelog copy"
        required: true
        type: string
      destination_folder:
        description: "Destination folder in the changelog repository"
        required: true
        type: string
      version:
        description: "Version string used in the changelog sync commit message"
        required: true
        type: string
    secrets:
      BOT_RELEASE_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  update:
    name: Copy changelog to destination repo
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOT_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.BOT_RELEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout repository (default ref)
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.deployed_ref }}
          token: ${{ steps.app_token.outputs.token }}

      - name: Resolve commit message
        id: commit_message
        shell: bash
        run: |
          MESSAGE="Update changelog for ${{ inputs.version }}"
          echo "value=$MESSAGE" >> "$GITHUB_OUTPUT"

      - name: Stage source changelog
        shell: bash
        env:
          SOURCE_FILE: ${{ inputs.source_file }}
        run: |
          set -euo pipefail

          if [ ! -f "$SOURCE_FILE" ]; then
            echo "::error::Source changelog not found: $SOURCE_FILE"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/changelog-sync"
          cp "$SOURCE_FILE" "$RUNNER_TEMP/changelog-sync/source-file"

      - name: Checkout destination repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.destination_repo }}
          ref: main
          path: changelog-destination
          token: ${{ steps.app_token.outputs.token }}

      - name: Commit changelog to destination
        shell: bash
        env:
          SOURCE_FILE: ${{ inputs.source_file }}
          DESTINATION_FOLDER: ${{ inputs.destination_folder }}
          COMMIT_MESSAGE: ${{ steps.commit_message.outputs.value }}
        run: |
          set -euo pipefail

          case "$DESTINATION_FOLDER" in
            ""|/*|*../*|../*)
              echo "::error::destination_folder must be a relative folder inside the destination repository"
              exit 1
              ;;
          esac

          destination_file="changelog-destination/${DESTINATION_FOLDER}/$(basename "$SOURCE_FILE")"
          mkdir -p "$(dirname "$destination_file")"
          cp "$RUNNER_TEMP/changelog-sync/source-file" "$destination_file"

          cd changelog-destination
          git config user.email "180547681+veamstudios-release-bot[bot]@users.noreply.github.com"
          git config user.name "Release Bot"
          git add "${DESTINATION_FOLDER}/$(basename "$SOURCE_FILE")"

          if git diff --cached --quiet; then
            echo "No changelog changes to commit."
            exit 0
          fi

          git commit -m "$COMMIT_MESSAGE"
          git push origin HEAD:main

name: Check Release Note
on:
  workflow_call:
    inputs:
      job-name:
        description: Display name for the changelog check
        required: false
        default: release-note
        type: string
      summary-title:
        description: Heading for the changelog review summary
        required: false
        default: Release announcement preview
        type: string
      job-summary:
        description: Optional explanation of the current changelog check behaviour
        required: false
        default: ''
        type: string
      coverage-mode:
        description: Advisory preview, or SAP iOS pilot diagnostics (preview or pilot)
        required: false
        default: preview
        type: string
permissions:
  contents: read
  pull-requests: read
jobs:
  release-note:
    name: ${{ inputs.job-name }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate changelog mode
        if: ${{ inputs.coverage-mode != 'preview' && inputs.coverage-mode != 'pilot' }}
        run: |
          printf '%s\n' '::error::coverage-mode must be preview or pilot.'
          exit 1
      - name: Describe changelog preview mode
        run: echo "Changelog review is advisory."
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preview changelog entries and Work Item links
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        uses: VeamStudios/.github/.github/actions/check-release-note@main
        with:
          body: ${{ github.event.pull_request.body }}
          head: ${{ github.event.pull_request.head.sha }}
          summary-title: ${{ inputs.summary-title }}

      - name: Collect SAP iOS coverage pilot diagnostics
        if: ${{ inputs.coverage-mode == 'pilot' }}
        # Draft dependency: restore @main only after the shared pilot is merged.
        uses: VeamStudios/.github/.github/actions/check-changelog-coverage@ci/sap-changelogs-pilot-20261007
        with:
          repository: ${{ github.repository }}
          head: ${{ github.event.pull_request.head.sha }}
          base: ${{ github.event.pull_request.base.sha }}

      - name: Describe this check
        if: ${{ always() && inputs.job-summary != '' }}
        env:
          CHECK_SUMMARY: ${{ inputs.job-summary }}
        run: printf '%s\n' "$CHECK_SUMMARY" >> "$GITHUB_STEP_SUMMARY"

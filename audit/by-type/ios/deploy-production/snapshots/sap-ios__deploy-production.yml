name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Optional expected marketing version for validation (e.g. 1.2.3)"
        required: false
        type: string
      beta_run_id:
        description: "Optional deploy-beta workflow run ID override"
        required: false
        type: string
      release_notes:
        description: "Additional release notes (optional — added to auto-generated notes)"
        required: false
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: production-${{ github.event.inputs.beta_run_id || 'latest-beta' }}
  cancel-in-progress: false

jobs:
  resolve-beta:
    name: Resolve Approved Beta Provenance
    runs-on: ubuntu-latest
    outputs:
      beta_run_id: ${{ steps.resolve_beta.outputs.run_id }}
      beta_run_attempt: ${{ steps.resolve_beta.outputs.run_attempt }}
      beta_run_url: ${{ steps.resolve_beta.outputs.run_url }}
      manifest_artifact_name: ${{ steps.resolve_beta.outputs.manifest_artifact_name }}
      commit_sha: ${{ steps.read_manifest.outputs.commit_sha }}
      marketing_version: ${{ steps.read_manifest.outputs.marketing_version }}
      build_number: ${{ steps.read_manifest.outputs.build_number }}
      version: ${{ steps.read_manifest.outputs.version }}
      created_at: ${{ steps.read_manifest.outputs.created_at }}
      tag_name: ${{ steps.read_manifest.outputs.tag_name }}
    steps:
      - name: Resolve beta workflow run
        id: resolve_beta
        uses: actions/github-script@v7
        env:
          OVERRIDE_BETA_RUN_ID: ${{ inputs.beta_run_id }}
        with:
          script: |
            const overrideRunId = process.env.OVERRIDE_BETA_RUN_ID?.trim();
            const { owner, repo } = context.repo;

            function parseManifestArtifact(artifact) {
              const match = artifact.name.match(/^beta-release-manifest-(\d+)-(\d+)$/);
              if (!match) {
                return null;
              }

              return {
                artifact,
                runId: match[1],
                runAttempt: match[2]
              };
            }

            let selectedRunId = null;
            let selectedRunAttempt = null;
            let selectedRunUrl = null;
            let manifestArtifactName = null;

            if (overrideRunId) {
              const { data } = await github.rest.actions.getWorkflowRun({
                owner,
                repo,
                run_id: Number(overrideRunId)
              });

              const expectedArtifactName = `beta-release-manifest-${data.id}-${data.run_attempt}`;
              const { data: artifactsData } = await github.rest.actions.listWorkflowRunArtifacts({
                owner,
                repo,
                run_id: Number(overrideRunId),
                name: expectedArtifactName,
                per_page: 100
              });
              const manifestArtifact = artifactsData.artifacts.find((artifact) => artifact.name === expectedArtifactName);

              if (!manifestArtifact) {
                core.setFailed(
                  `Workflow run ${data.id} (attempt ${data.run_attempt}) does not have the expected beta release manifest artifact.`
                );
                return;
              }

              selectedRunId = String(data.id);
              selectedRunAttempt = String(data.run_attempt);
              selectedRunUrl = data.html_url;
              manifestArtifactName = manifestArtifact.name;
            } else {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner,
                repo,
                per_page: 100
              });

              const matchingArtifacts = data.artifacts
                .filter((artifact) => !artifact.expired)
                .map(parseManifestArtifact)
                .filter((candidate) => candidate !== null)
                .filter((candidate) => candidate.artifact.workflow_run?.head_branch === 'main')
                .sort((left, right) => {
                  const leftCreatedAt = left.artifact.created_at ?? "";
                  const rightCreatedAt = right.artifact.created_at ?? "";
                  return rightCreatedAt.localeCompare(leftCreatedAt);
                });

              const latestArtifact = matchingArtifacts[0];
              if (!latestArtifact) {
                core.setFailed('Unable to resolve a beta release manifest artifact from the main branch.');
                return;
              }

              selectedRunId = latestArtifact.runId;
              selectedRunAttempt = latestArtifact.runAttempt;
              selectedRunUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${latestArtifact.runId}`;
              manifestArtifactName = latestArtifact.artifact.name;
            }

            core.setOutput('run_id', selectedRunId);
            core.setOutput('run_attempt', selectedRunAttempt);
            core.setOutput('run_url', selectedRunUrl);
            core.setOutput('manifest_artifact_name', manifestArtifactName);

      - name: Download beta release manifest
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve_beta.outputs.run_id }}
          name: ${{ steps.resolve_beta.outputs.manifest_artifact_name }}
          path: ./artifacts

      - name: Read beta manifest
        id: read_manifest
        shell: bash
        run: |
          MANIFEST_PATH=""
          for candidate in ./artifacts/release-manifest.json ./artifacts/*/release-manifest.json; do
            if [ -f "$candidate" ]; then
              MANIFEST_PATH="$candidate"
              break
            fi
          done

          if [ -z "$MANIFEST_PATH" ]; then
            echo "::error::release-manifest.json not found after artifact download"
            exit 1
          fi

          MANIFEST_PATH="$MANIFEST_PATH" python3 <<'PY'
          import json
          import os

          manifest_path = os.environ["MANIFEST_PATH"]
          with open(manifest_path, "r", encoding="ascii") as handle:
              manifest = json.load(handle)

          output_path = os.environ["GITHUB_OUTPUT"]
          with open(output_path, "a", encoding="utf-8") as output:
              output.write(f"commit_sha={manifest['commit_sha']}\n")
              output.write(f"marketing_version={manifest['marketing_version']}\n")
              output.write(f"build_number={manifest['build_number']}\n")
              output.write(f"version={manifest['version']}\n")
              output.write(f"created_at={manifest['created_at']}\n")
              output.write(f"tag_name=v{manifest['marketing_version']}\n")
          PY

      - name: Validate beta manifest
        shell: bash
        run: |
          if [ "${{ inputs.expected_version }}" != "" ] && [ "${{ inputs.expected_version }}" != "${{ steps.read_manifest.outputs.marketing_version }}" ]; then
            echo "::error::Production release stopped because the requested version does not match the approved beta version."
            echo "::error::Next steps:"
            echo "::error::1. Use the matching beta run, or"
            echo "::error::2. Bump the version before retrying."
            exit 1
          fi

  build-cloud:
    name: Build Cloud From Approved Beta Commit
    needs: resolve-beta
    uses: VeamStudios/.github/.github/workflows/deploy-ios-testflight.yml@main
    with:
      configuration: cloud
      environment_name: prod
      ipa_path: ./fastlane/builds/site-audit-pro-cloud.ipa
      checkout_ref: ${{ needs.resolve-beta.outputs.commit_sha }}
      capture_commit_sha: true
      upload_cloud_archive: true
      upload_release_manifest: false
      build_number_override: ${{ needs.resolve-beta.outputs.build_number }}
      expected_marketing_version: ${{ needs.resolve-beta.outputs.marketing_version }}
    secrets: inherit

  validate-release:
    name: Validate Release Provenance
    runs-on: ubuntu-latest
    needs: [resolve-beta, build-cloud]
    steps:
      - name: Compare beta and cloud provenance
        run: |
          if [ "${{ needs.resolve-beta.outputs.commit_sha }}" != "${{ needs.build-cloud.outputs.commit_sha }}" ]; then
            echo "::error::Production release stopped because the cloud build commit does not match the approved beta commit."
            echo "::error::Next steps:"
            echo "::error::1. Re-run production from the approved beta run."
            exit 1
          fi

          if [ "${{ needs.resolve-beta.outputs.marketing_version }}" != "${{ needs.build-cloud.outputs.marketing_version }}" ]; then
            echo "::error::Production release stopped because the cloud marketing version does not match the approved beta version."
            echo "::error::Next steps:"
            echo "::error::1. Bump the version, or"
            echo "::error::2. Rebuild from the correct beta commit."
            exit 1
          fi

          if [ "${{ needs.resolve-beta.outputs.build_number }}" != "${{ needs.build-cloud.outputs.build_number }}" ]; then
            echo "::error::Production release stopped because the cloud build number does not match the approved beta build number."
            echo "::error::Next steps:"
            echo "::error::1. Resolve the App Store Connect build-number conflict."
            echo "::error::2. Rerun production."
            exit 1
          fi

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [resolve-beta, build-cloud, validate-release]
    environment: prod
    outputs:
      tag_name: ${{ needs.resolve-beta.outputs.tag_name }}
    steps:
      - name: Mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_RELEASE_APP_ID }}
          private-key: ${{ secrets.BOT_RELEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Setup Git authentication
        run: |
          git config --global user.email "180547681+veamstudios-release-bot[bot]@users.noreply.github.com"
          git config --global user.name "Release Bot"
          echo "machine github.com login 'Release Bot' password ${{ steps.app_token.outputs.token }}" > ~/.netrc
          chmod 600 ~/.netrc

      - name: Checkout approved beta commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-beta.outputs.commit_sha }}
          fetch-depth: 1
          token: ${{ steps.app_token.outputs.token }}

      - name: Download cloud archive artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-cloud.outputs.cloud_archive_artifact_name }}
          path: ./artifacts

      - name: Locate cloud archive path
        id: archive_path
        shell: bash
        run: |
          ARCHIVE_PATH=""
          for candidate in ./artifacts/cloud.xcarchive ./artifacts/*/cloud.xcarchive; do
            if [ -d "$candidate" ]; then
              ARCHIVE_PATH="$candidate"
              break
            fi
          done

          if [ -z "$ARCHIVE_PATH" ]; then
            echo "::error::cloud.xcarchive not found after artifact download"
            exit 1
          fi

          echo "path=$ARCHIVE_PATH" >> "$GITHUB_OUTPUT"

      - name: Zip xcarchive
        id: zip_archive
        run: |
          ARCHIVE_NAME="SiteAuditPro-v${{ needs.resolve-beta.outputs.marketing_version }}-cloud.xcarchive.zip"
          ZIP_PATH="./artifacts/$ARCHIVE_NAME"
          zip -r "$ZIP_PATH" "${{ steps.archive_path.outputs.path }}"
          echo "archive_zip=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Ensure tag does not already exist
        shell: bash
        env:
          TAG_NAME: ${{ needs.resolve-beta.outputs.tag_name }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "::error::Tag $TAG_NAME already exists."
            echo "::error::Next steps:"
            echo "::error::1. Confirm whether this production release already completed."
            echo "::error::2. Delete the existing tag only if the partial release should be recreated."
            echo "::error::3. Rerun the workflow after resolving the existing tag."
            exit 1
          fi

      - name: Create and push tag
        env:
          TAG_NAME: ${{ needs.resolve-beta.outputs.tag_name }}
          COMMIT_SHA: ${{ needs.resolve-beta.outputs.commit_sha }}
        run: |
          git tag -a "$TAG_NAME" "$COMMIT_SHA" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"
          echo "Created tag: $TAG_NAME at commit $COMMIT_SHA"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
        with:
          tag_name: ${{ needs.resolve-beta.outputs.tag_name }}
          name: ${{ needs.resolve-beta.outputs.tag_name }}
          target_commitish: ${{ needs.resolve-beta.outputs.commit_sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ${{ inputs.release_notes }}
            ### Approved Beta Provenance
            - **Beta Run**: [#${{ needs.resolve-beta.outputs.beta_run_id }}](${{ needs.resolve-beta.outputs.beta_run_url }})
            - **Beta Commit**: ${{ needs.resolve-beta.outputs.commit_sha }}
            - **Beta Version**: ${{ needs.resolve-beta.outputs.version }}
            - **Beta Manifest Created At**: ${{ needs.resolve-beta.outputs.created_at }}
            ### Released Cloud Build
            - **Cloud Commit**: ${{ needs.build-cloud.outputs.commit_sha }}
            - **Cloud Version**: ${{ needs.build-cloud.outputs.version }}
            - **Cloud Archive Artifact**: ${{ needs.build-cloud.outputs.cloud_archive_artifact_name }}
          files: |
            ${{ steps.zip_archive.outputs.archive_zip }}
          draft: false
          prerelease: false

      - name: Update Changelog Website
        uses: dmnemec/copy_file_to_another_repo_action@v1.1.1
        env:
          API_TOKEN_GITHUB: ${{ steps.app_token.outputs.token }}
        with:
          source_file: "CHANGELOG.md"
          destination_repo: "VeamStudios/siteauditpro.com"
          destination_folder: "src/app/content/changelogs/ios"
          destination_branch: "main"
          user_email: "180547681+veamstudios-release-bot[bot]@users.noreply.github.com"
          user_name: "Release Bot"
          commit_message: "Update iOS changelog for v${{ needs.resolve-beta.outputs.marketing_version }}"

  notify:
    name: Notify Release
    needs: [resolve-beta, build-cloud, create-release]
    uses: VeamStudios/.github/.github/workflows/release-notifications.yml@main
    with:
      version: ${{ needs.resolve-beta.outputs.tag_name }}
      environment: production
      beta_run_id: ${{ needs.resolve-beta.outputs.beta_run_id }}
      beta_run_url: ${{ needs.resolve-beta.outputs.beta_run_url }}
      beta_commit_sha: ${{ needs.resolve-beta.outputs.commit_sha }}
      beta_version: ${{ needs.resolve-beta.outputs.version }}
      beta_build_number: ${{ needs.resolve-beta.outputs.build_number }}
      cloud_commit_sha: ${{ needs.build-cloud.outputs.commit_sha }}
      cloud_version: ${{ needs.build-cloud.outputs.version }}
      cloud_build_number: ${{ needs.build-cloud.outputs.build_number }}
      slack_footer_mrkdwn: "Please inform any customers waiting on fixes in this release."
    secrets: inherit

  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [resolve-beta, build-cloud, validate-release, create-release, notify]
    if: always()
    steps:
      - name: Display Summary
        run: |
          if [ "${{ needs.resolve-beta.result }}" != "success" ]; then
            echo "Production deploy stopped while resolving the approved beta provenance."
            echo "Next steps:"
            echo "1. Review the resolve-beta job output above."
            echo "2. Confirm the beta run ID or regenerate a beta release manifest."
            echo "3. Rerun the production workflow."
          elif [ "${{ needs.build-cloud.result }}" != "success" ]; then
            echo "Production deploy stopped while building the cloud release from the approved beta commit."
            echo "Next steps:"
            echo "1. Review the build-cloud job output above."
            echo "2. Fix the build or signing issue."
            echo "3. Rerun the production workflow."
          elif [ "${{ needs.validate-release.result }}" != "success" ]; then
            echo "Production deploy stopped because the release provenance validation failed."
            echo "Next steps:"
            echo "1. Review the validate-release job output above."
            echo "2. Resolve the beta/cloud version, build number, or commit mismatch."
            echo "3. Rerun the production workflow."
          elif [ "${{ needs.create-release.result }}" != "success" ]; then
            echo "Production deploy stopped while creating the GitHub release."
            echo "Next steps:"
            echo "1. Review the create-release job output above."
            echo "2. Fix the tagging, release, or changelog sync failure."
            echo "3. Rerun the production workflow."
          elif [ "${{ needs.notify.result }}" != "success" ]; then
            echo "Production deploy finished the release steps, but the notification step failed."
            echo "Next steps:"
            echo "1. Review the notify job output above."
            echo "2. Fix the notification workflow issue."
            echo "3. Rerun the notification or production workflow if needed."
          else
            echo "Production deploy completed successfully."
            echo ""
            echo "Release: ${{ needs.resolve-beta.outputs.tag_name }}"
            echo "Approved Beta Run: ${{ needs.resolve-beta.outputs.beta_run_id }}"
            echo "Approved Beta Commit: ${{ needs.resolve-beta.outputs.commit_sha }}"
            echo "Approved Beta Version: ${{ needs.resolve-beta.outputs.version }}"
            echo "Released Cloud Commit: ${{ needs.build-cloud.outputs.commit_sha }}"
            echo "Released Cloud Version: ${{ needs.build-cloud.outputs.version }}"
            echo "Released Cloud Archive Artifact: ${{ needs.build-cloud.outputs.cloud_archive_artifact_name }}"
            echo ""
            echo "Release URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.resolve-beta.outputs.tag_name }}"
          fi

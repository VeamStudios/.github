name: Launch Hub Production Mirror

on:
  workflow_call:
    inputs:
      product:
        description: "Product slug used to resolve the Launch Hub Product page ID. Supported values: cip, sap"
        required: false
        default: ""
        type: string
      product_page_id:
        description: "Optional Notion Product page ID override used to filter Launch Hub Work Items"
        required: false
        default: ""
        type: string
      work_items_data_source_id:
        description: "Notion Work Items data source ID"
        required: false
        default: "20aeddfe-a3f7-41e9-b440-c9eb6b26887f"
        type: string
      platform:
        description: "Release/deploy status target: ios, web, android, backend, or all"
        required: false
        default: "all"
        type: string
      production_state:
        description: "Optional release/deploy status value to write for the platform"
        required: false
        default: ""
        type: string
      production_version:
        description: "Optional production version or release tag to write"
        required: false
        default: ""
        type: string
      production_evidence:
        description: "Optional URL or text evidence for the production sync"
        required: false
        default: ""
        type: string
      firebase_project_id:
        description: "Optional Firebase production project ID for Remote Config reads"
        required: false
        default: ""
        type: string
      github_environment:
        description: "Optional GitHub environment name for environment-scoped secrets"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Compute updates and print a summary without writing Notion"
        required: false
        default: false
        type: boolean
    secrets:
      NOTION_TOKEN:
        required: false
      SERVICE_ACCOUNT_BASE64:
        required: false

jobs:
  sync:
    name: Sync Launch Hub
    if: ${{ inputs.github_environment == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Sync Launch Hub production mirror
        uses: VeamStudios/.github/.github/actions/launch-hub-production-mirror@main
        with:
          product: ${{ inputs.product }}
          product_page_id: ${{ inputs.product_page_id }}
          work_items_data_source_id: ${{ inputs.work_items_data_source_id }}
          platform: ${{ inputs.platform }}
          production_state: ${{ inputs.production_state }}
          production_version: ${{ inputs.production_version }}
          production_evidence: ${{ inputs.production_evidence }}
          firebase_project_id: ${{ inputs.firebase_project_id }}
          firebase_service_account: ${{ secrets.SERVICE_ACCOUNT_BASE64 }}
          notion_token: ${{ secrets.NOTION_TOKEN }}
          dry_run: ${{ inputs.dry_run }}

  sync-with-environment:
    name: Sync Launch Hub (${{ inputs.github_environment }})
    if: ${{ inputs.github_environment != '' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}
    steps:
      - name: Sync Launch Hub production mirror
        uses: VeamStudios/.github/.github/actions/launch-hub-production-mirror@main
        with:
          product: ${{ inputs.product }}
          product_page_id: ${{ inputs.product_page_id }}
          work_items_data_source_id: ${{ inputs.work_items_data_source_id }}
          platform: ${{ inputs.platform }}
          production_state: ${{ inputs.production_state }}
          production_version: ${{ inputs.production_version }}
          production_evidence: ${{ inputs.production_evidence }}
          firebase_project_id: ${{ inputs.firebase_project_id }}
          firebase_service_account: ${{ secrets.SERVICE_ACCOUNT_BASE64 }}
          notion_token: ${{ secrets.NOTION_TOKEN }}
          dry_run: ${{ inputs.dry_run }}

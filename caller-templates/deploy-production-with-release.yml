# Deploy Production with Release Evidence - Caller Workflow Template
#
# Copy this file into your repo's .github/workflows/ directory and
# customise the deploy job to call your repo's _deploy.yml.
#
# Creates a GitHub release and records exact deployment evidence in Notion.
# NotionWorkers publishes eligible entries to Slack and saves delivery receipts.

name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number for the release (e.g. 1.2.3)"
        required: true
        type: string
      release_notes:
        description: "Additional release notes (optional)"
        required: false
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Production
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      env: prod

  create-release:
    name: Create GitHub Release
    needs: deploy
    uses: VeamStudios/.github/.github/workflows/create-github-release.yml@main
    with:
      version: ${{ inputs.version }}
      deploy_sha: ${{ needs.deploy.outputs.commit_sha }}
      release_notes: ${{ inputs.release_notes }}
      environment: prod
    secrets:
      BOT_RELEASE_PRIVATE_KEY: ${{ secrets.BOT_RELEASE_PRIVATE_KEY }}

  record-release-ledger:
    name: Record release evidence
    needs: deploy
    uses: VeamStudios/.github/.github/workflows/record-release.yml@main
    with:
      product: Site Audit Pro # Set the product and target for this repository.
      target: web
      version: v${{ inputs.version }}
      commit: ${{ needs.deploy.outputs.commit_sha }}
      phase: deployed
      verification_url: https://your-production-host.example/release-info.json
    secrets: inherit

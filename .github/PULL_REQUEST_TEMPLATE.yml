name: Pull Request
description: Submit changes with structured information for reviewers
title: "[TYPE]: <title>"
body:
  - type: dropdown
    id: pr_type
    attributes:
      label: PR Type
      description: What type of change does this PR introduce?
      options:
        - fix (bug fix)
        - feat (new feature)
        - build (build system or dependencies)
        - chore (maintenance tasks)
        - ci (CI configuration)
        - docs (documentation)
        - style (formatting, missing semicolons, etc)
        - refac (refactoring code)
        - perf (performance improvements)
        - test (adding tests)
    validations:
      required: true

  - type: input
    id: issue_link
    attributes:
      label: Issue Link
      description: Link to the issue this PR resolves
      placeholder: "Fixes #123"
    validations:
      required: false

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: What needs to be completed for this PR to be approved?
      placeholder: |
        - [ ] Criteria 1
        - [ ] Criteria 2
        - [ ] Criteria 3
    validations:
      required: true

  - type: input
    id: documentation_link
    attributes:
      label: Documentation Link
      description: Link to where these changes were agreed upon (Notion, Jira, etc.)
      placeholder: "https://notion.so/..."
    validations:
      required: false

  - type: textarea
    id: changes_description
    attributes:
      label: Changes Description
      description: Brief description of what you changed and why
    validations:
      required: true

  - type: textarea
    id: review_notes
    attributes:
      label: Review Notes
      description: Any additional context, concerns, or implementation details for reviewers
      placeholder: |
        Note: Suggested improvements/optimizations will be added as new Issues to avoid blocking PR approval
    validations:
      required: false

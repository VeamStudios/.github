name: Deploy Beta

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-nightly-merge:
    name: Check for recent merges to main
    uses: VeamStudios/.github/.github/workflows/merge-gate.yml@main
    permissions:
      pull-requests: read
    with:
      base_branch: main
      window_hours: 24
      max_pages: 10

  deploy:
    needs: check-nightly-merge
    if: ${{ github.event_name != 'schedule' || needs.check-nightly-merge.outputs.should_deploy == 'true' }}
    uses: ./.github/workflows/_deploy.yml
    with:
      deployment_environment: beta
      build_script: build-beta
      firebase_project: checklistinspectorpro-beta
      service_account_file: sa-beta.json
      firebase_config_file: firebase-dev-beta.json
    secrets:
      SERVICE_ACCOUNT_BASE64: ${{ secrets.SERVICE_ACCOUNT_BASE64 }}

name: PR Notion Docs Sync

# Notion database URLs and API version are set in job env below — change them there only
# (callers do not pass these).
#
# Only workflow_call: runs in the *caller's* repository (app repo). Do not add
# workflow_dispatch here — a manual run from this .github repo would use the wrong
# repository context. Manual runs: use caller-templates/pr-notion-docs-sync.yml in your app repo.
#
# Callers must grant `models: read` for GitHub Models (`actions/ai-inference`) on the documentation brief.
# Inputs: use-ai-inference (default true), ai-model, max-tokens, app-models-excerpt-path, data-models-path-hint.

on:
  workflow_call:
    inputs:
      pr-number:
        description: "PR number (omit when the caller workflow has pull_request context)"
        required: false
        type: string
      dry-run:
        description: "Print summary to the log only; do not create or update Notion"
        required: false
        type: boolean
        default: false
      use-ai-inference:
        description: "Use GitHub Models (actions/ai-inference) to generate a documentation brief for Notion"
        required: false
        type: boolean
        default: true
      ai-model:
        description: "Model id for documentation brief generation"
        required: false
        type: string
        default: "openai/gpt-4.1"
      max-tokens:
        description: "Max tokens for the documentation brief response"
        required: false
        type: number
        default: 3500
      app-models-excerpt-path:
        description: "Path within this (caller) repo to excerpt for the AI brief — file or directory of Swift models (e.g. iOS App/Data/Models). Capped by workflow."
        required: false
        type: string
        default: "iOS App/Data/Models"
      data-models-path-hint:
        description: "Substring to detect app Data/Models paths in changed files (e.g. Data/Models)"
        required: false
        type: string
        default: "Data/Models"
    secrets:
      notion-token:
        description: "Notion integration token"
        required: true

jobs:
  sync_pr_to_notion:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      models: read
    env:
      # https://developers.notion.com/reference/versioning — bump with Notion upgrade guides
      NOTION_VERSION: "2026-03-11"
      GITHUB_REPOS_DB_URL: "https://www.notion.so/veamstudios/7657c233579e40909b9cf1640e4904f8"
      PRODUCTS_DB_URL: "https://www.notion.so/veamstudios/30c069083a03803e9636f97345e2d433"
      PROPOSALS_DB_URL: "https://www.notion.so/veamstudios/2ca691667ea34ddfabee572644ce8290"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect app and platform (same heuristics as QA Pipeline)
        id: detect_app
        run: |
          REPO_BASENAME=$(basename "${{ github.repository }}")

          PLATFORM="Unknown Platform"
          IFS='-' read -ra SEGMENTS <<< "$REPO_BASENAME"
          for SEGMENT in "${SEGMENTS[@]}"; do
            case "$SEGMENT" in
              iOS)      PLATFORM="iOS/iPadOS"; break ;;
              Android)  PLATFORM="Android"; break ;;
              Web)      PLATFORM="Web"; break ;;
            esac
          done

          case "$REPO_BASENAME" in
            *CIP*|*ChecklistInspector*)  APP_NAME="Checklist Inspector Pro" ;;
            *SAP*|*SiteAudit*)           APP_NAME="Site Audit Pro" ;;
            *)                           APP_NAME="${REPO_BASENAME%%-*}" ;;
          esac

          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
          echo "Detected app: $APP_NAME | platform: $PLATFORM"

      - name: Parse Notion database IDs and resolve PR number
        id: pr_and_db_ids
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs['pr-number'] || github.event.pull_request.number }}
          INPUT_GITHUB_REPOS_DB_URL: ${{ env.GITHUB_REPOS_DB_URL }}
          INPUT_PRODUCTS_DB_URL: ${{ env.PRODUCTS_DB_URL }}
          INPUT_PROPOSALS_DB_URL: ${{ env.PROPOSALS_DB_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys

          def extract_db_id(value: str) -> str:
            if not value:
              return ""
            m = re.search(r'([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})', value)
            if m:
              return m.group(1).replace("-", "")
            m = re.search(r'([0-9a-fA-F]{32})', value)
            if m:
              return m.group(1).lower()
            return ""

          required = {
            "github_repos_db_id": extract_db_id(os.getenv("INPUT_GITHUB_REPOS_DB_URL", "")),
            "products_db_id": extract_db_id(os.getenv("INPUT_PRODUCTS_DB_URL", "")),
            "proposals_db_id": extract_db_id(os.getenv("INPUT_PROPOSALS_DB_URL", "")),
          }

          missing = [k for k, v in required.items() if not v]
          if missing:
            print(f"Missing required Notion database IDs: {', '.join(missing)}", file=sys.stderr)
            sys.exit(1)

          repository = os.getenv("GITHUB_REPOSITORY", "")
          if "/" not in repository:
            print("This workflow must run in a repository context.", file=sys.stderr)
            sys.exit(1)
          owner, repo_name = repository.split("/", 1)

          pr_number = os.getenv("PR_NUMBER", "").strip()
          if not pr_number:
            print("PR number is required. Pass pr-number from the caller workflow (or pull_request context).", file=sys.stderr)
            sys.exit(1)

          payload = {
            "repo_owner": owner,
            "repo_name": repo_name,
            "pr_number": pr_number,
            **required,
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
            for key, val in payload.items():
              out.write(f"{key}={val}\n")
          PY

      - name: Collect PR data and documentation signals
        id: collect_pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr_and_db_ids.outputs.pr_number }}
          APP_NAME: ${{ steps.detect_app.outputs.app_name }}
          PLATFORM: ${{ steps.detect_app.outputs.platform }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DATA_MODELS_PATH_HINT: ${{ inputs['data-models-path-hint'] }}
        run: |
          set -e
          gh pr view "$PR_NUMBER" \
            --json files,headRefOid,url,title,body,labels,baseRefName,headRefName,additions,deletions \
            > pr_view.json
          gh pr view "$PR_NUMBER" --json commits > commits.json 2>/dev/null || echo '{"commits":[]}' > commits.json
          gh pr diff "$PR_NUMBER" --stat 2>/dev/null | head -c 8000 > diff_stat.txt || true
          gh pr diff "$PR_NUMBER" > pr_diff_full.txt 2>/dev/null || echo "(No diff available.)" > pr_diff_full.txt
          # Keep small: GitHub Models gpt-4.1 enforces ~8000-token total input (system + user prompt).
          head -c 4000 pr_diff_full.txt > pr_diff.txt

          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.parse
          from collections import Counter

          pr_number = os.environ["PR_NUMBER"]
          github_repository = os.environ.get("GITHUB_REPOSITORY", "")
          data_models_hint = (os.environ.get("DATA_MODELS_PATH_HINT") or "Data/Models").strip()
          app_name = os.environ.get("APP_NAME", "").strip()
          platform = os.environ.get("PLATFORM", "").strip()

          with open("pr_view.json", "r", encoding="utf-8") as f:
            data = json.load(f)
          try:
            with open("commits.json", "r", encoding="utf-8") as f:
              cj = json.load(f)
            data["commits"] = cj.get("commits") or []
          except (OSError, json.JSONDecodeError):
            data["commits"] = []

          pr_url = data.get("url", "")
          pr_title = data.get("title", "")
          pr_body = (data.get("body", "") or "")[:4000]
          pr_sha = data.get("headRefOid", "")
          base_ref = data.get("baseRefName", "") or ""
          head_ref = data.get("headRefName", "") or ""
          additions = data.get("additions")
          deletions = data.get("deletions")
          label_names = [x.get("name", "") for x in data.get("labels", []) if x.get("name")]

          commits = data.get("commits") or []
          commit_subjects = []
          for c in commits[:25]:
            msg = (c.get("messageHeadline") or c.get("message", "") or "").strip()
            if msg:
              commit_subjects.append(msg)

          paths = [f.get("path", "") for f in data.get("files", []) if f.get("path")]
          paths_sorted = sorted(set(paths))

          gh_owner, gh_repo = (
              github_repository.split("/", 1) if "/" in github_repository else ("", "")
          )
          data_model_paths = [
              p
              for p in paths_sorted
              if data_models_hint in p.replace("\\", "/")
          ]
          blob_lines = []
          for p in data_model_paths:
            norm = p.replace("\\", "/")
            enc = urllib.parse.quote(norm, safe="/")
            if gh_owner and gh_repo and pr_sha:
              url = f"https://github.com/{gh_owner}/{gh_repo}/blob/{pr_sha}/{enc}"
              blob_lines.append(f"- `{norm}` — {url}")
            else:
              blob_lines.append(f"- `{norm}`")
          with open("data_models_prompt.txt", "w", encoding="utf-8") as f:
            f.write("## Changed files under Data/Models (this PR)\n\n")
            if blob_lines:
              f.write("\n".join(blob_lines) + "\n")
            else:
              f.write(
                  "(No changed files matched this PR whose path contains the Data/Models hint.)\n"
              )

          MAX_PATHS = 80
          files_list = paths_sorted[:MAX_PATHS]
          files_truncated = len(paths_sorted) > MAX_PATHS
          files_more = max(0, len(paths_sorted) - MAX_PATHS)

          diff_stat = ""
          if os.path.isfile("diff_stat.txt"):
            with open("diff_stat.txt", "r", encoding="utf-8", errors="replace") as f:
              diff_stat = f.read()

          area_rules = {
            "iOS": lambda p: p.endswith(".swift") or "/ios/" in p.lower(),
            "Web": lambda p: any(p.endswith(e) for e in (".js",".jsx",".ts",".tsx",".css",".scss",".html")) or "/web/" in p.lower(),
            "Backend": lambda p: any(p.endswith(e) for e in (".py",".go",".java")) or any(d in p.lower() for d in ("/backend/","/server/")),
            "CI/Config": lambda p: any(p.endswith(e) for e in (".yml",".yaml",".json",".toml")) or ".github/" in p.lower(),
            "Docs": lambda p: any(p.endswith(e) for e in (".md",".rst",".txt")) or "/docs/" in p.lower(),
          }
          area_counts = Counter()
          for path in paths:
            matched = False
            for area, test in area_rules.items():
              if test(path):
                area_counts[area] += 1
                matched = True
            if not matched:
              area_counts["Other"] += 1

          areas = sorted(area_counts.keys())
          change_summary_parts = [f"{area}: {area_counts[area]} file(s)" for area in areas]
          change_summary = ", ".join(change_summary_parts)

          primary_area = ""
          if area_counts:
            primary_area = max(area_counts.items(), key=lambda x: x[1])[0]

          def impact_zones_from_paths(paths_list):
            zones = []
            for p in paths_list:
              parts = p.replace("\\", "/").split("/")
              parts = [x for x in parts if x]
              if not parts:
                continue
              if len(parts) >= 2 and parts[0].lower().startswith("ios"):
                zone = "/".join(parts[1:3]) if len(parts) >= 3 else parts[1]
              elif len(parts) >= 2:
                zone = "/".join(parts[:2])
              else:
                zone = parts[0]
              zones.append(zone)
            return sorted(set(zones))[:30]

          def extract_components_for_platform(plat: str, paths_list):
            pl = (plat or "").lower()
            if "ios" in pl or "ipados" in pl:
              file_re = re.compile(r"\.swift$")
              pat = re.compile(r"(class|struct|enum|protocol) [A-Za-z0-9_]+")
              git_paths = ["*.swift"]
            elif pl == "android":
              file_re = re.compile(r"\.(kt|java)$")
              pat = re.compile(r"(class|interface|object) [A-Za-z0-9_]+")
              git_paths = ["*.kt", "*.java"]
            elif pl == "web":
              file_re = re.compile(r"\.(jsx?|tsx?)$")
              pat = re.compile(r"(export )?(function|const|class) [A-Za-z0-9_]+")
              git_paths = ["*.js", "*.jsx", "*.ts", "*.tsx"]
            else:
              return [], []

            names = []
            for path in paths_list:
              if not file_re.search(path):
                continue
              if not os.path.isfile(path):
                continue
              try:
                with open(path, "r", encoding="utf-8", errors="replace") as f:
                  content = f.read()
                for m in pat.finditer(content):
                  line = m.group(0)
                  tail = line.split()[-1]
                  if tail:
                    names.append(tail)
              except OSError:
                pass
            return sorted(set(names)), git_paths

          def build_cross_references(components, git_paths, max_chars=1200):
            if not components or not git_paths:
              return ""
            lines = []
            for comp in components[:40]:
              lines.append(f"=== Usage of {comp} ===")
              try:
                cmd = ["git", "grep", "-l", comp, "--"] + git_paths
                r = subprocess.run(
                  cmd,
                  cwd=os.getcwd(),
                  capture_output=True,
                  text=True,
                  timeout=120,
                )
                out = (r.stdout or "").strip().splitlines()[:20]
                lines.extend(out)
              except (subprocess.TimeoutExpired, OSError):
                pass
              lines.append("")
            text = "\n".join(lines)
            if len(text) > max_chars:
              text = text[:max_chars] + "\n[... truncated ...]"
            return text

          impact_zones = impact_zones_from_paths(paths_sorted)
          component_names, git_globs = extract_components_for_platform(platform, paths_sorted)
          cross_references = build_cross_references(component_names, git_globs)

          pr_diff_excerpt = ""
          if os.path.isfile("pr_diff.txt"):
            with open("pr_diff.txt", "r", encoding="utf-8", errors="replace") as f:
              pr_diff_excerpt = f.read()

          def fmt_int(v):
            return str(v) if v is not None else "?"

          label_part = ", ".join(label_names) if label_names else "none"
          areas_part = ", ".join(areas) if areas else "none"
          summary_line = (
            f"{len(paths)} files | +{fmt_int(additions)}/-{fmt_int(deletions)} | "
            f"labels: {label_part} | areas: {areas_part}"
          )[:2000]

          signals = {
            "app_name": app_name,
            "platform": platform,
            "base_ref": base_ref,
            "head_ref": head_ref,
            "labels": label_names,
            "additions": additions,
            "deletions": deletions,
            "commit_subjects": commit_subjects,
            "files": files_list,
            "files_total": len(paths_sorted),
            "files_truncated": files_truncated,
            "files_more": files_more,
            "diff_stat": diff_stat,
            "diff_stat_max_chars": 8000,
            "primary_area": primary_area,
            "areas_breakdown": dict(area_counts),
            "impact_zones": impact_zones,
            "component_names": component_names[:80],
            "cross_references": cross_references,
            "cross_references_max_chars": 4000,
            "pr_diff_excerpt": pr_diff_excerpt,
            "pr_diff_max_chars": 8000,
            "data_models_changed": data_model_paths,
            "data_models_path_hint": data_models_hint,
          }
          with open("signals.json", "w", encoding="utf-8") as f:
            json.dump(signals, f, indent=2)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
            out.write(f"pr_url={str(pr_url).replace(chr(10), ' ')}\n")
            out.write(f"pr_title={str(pr_title).replace(chr(10), ' ')}\n")
            out.write(f"pr_sha={pr_sha}\n")
            out.write(f"change_summary={change_summary}\n")
            out.write(f"total_files={len(paths)}\n")
            out.write(f"summary_line={summary_line.replace(chr(10), ' ')}\n")

          with open("pr_body.txt", "w", encoding="utf-8") as f:
            f.write(pr_body)

          with open("pr_title.txt", "w", encoding="utf-8") as f:
            f.write(pr_title)

          with open("changed_files.txt", "w", encoding="utf-8") as f:
            f.write("\n".join(paths_sorted))

          with open("cross_references.txt", "w", encoding="utf-8") as f:
            f.write(cross_references or "")

          areas_json = json.dumps(areas)
          with open("areas.json", "w", encoding="utf-8") as f:
            f.write(areas_json)
          PY

      - name: Create documentation brief system prompt
        if: ${{ !inputs['dry-run'] && inputs['use-ai-inference'] }}
        run: |
          cat > doc_system_prompt.txt << 'EOF'
          You are a senior technical writer and product documentation strategist. Your output will live in Notion and
          be consumed by Notion AI and human editors to align with our proposal tabs: Models, Structure, Behaviour, Navigation.

          RESPONSE FORMAT — use exactly these Markdown section headers (###) in this order; British spelling "Behaviour":

          ### User-facing summary
          2–4 sentences in plain language. What changed from the customer’s perspective. No stack traces.

          ### Models (evidence from this PR)
          Domain and storage tied to this PR. Each bullet MUST start with ONE tag:
          - [diff] — only if the detail appears literally in the provided code diff.
          - [file path] — only if the detail is supported by a changed file path or file listed under Data/Models / app models excerpt below.
          - [unverified guess] — only when inferring from naming; never present a guess as fact (keep the tag).

          Include Swift types or Firestore paths only when they meet [diff] or [file path]. If changed files contain no Firestore path
          literals, state: "No Firestore path literals in changed files (per diff)." If nothing data-related appears: "None identified from this PR."

          ### Structure
          Layout of the UI wherever this feature appears: screens, panels, sections, stacks, sheets—where elements live
          on screen. Bullet list; name areas as users see them.

          ### Behaviour
          What happens when the user interacts: taps, toggles, gestures, saves, validation, loading and error states,
          permissions—outcomes the user notices. Bullet list ordered roughly in flow order.

          ### Navigation
          Where the user comes from and where they go: entry points, destinations, deep links, tabs, back/dismiss behaviour.
          Use clear "From → To" bullets or short arrows. Cover only routes touched by this PR.

          ### Documentation impact
          Bullet list: help articles, release notes, or internal docs to add or update—or "None" if not applicable.

          ### Confidence and gaps
          Short paragraph: what you inferred from the diff vs. what is unclear. Say if Firestore paths are guessed from naming only.

          RULES:
          - Fill every section. Use "None identified" when a section has no signal in the PR—do not invent Firestore paths or screens.
          - Be specific; avoid generic filler ("verify functionality", "test thoroughly").
          - Prefer product language; cite file or type names only when they disambiguate user-visible behaviour.
          EOF

      - name: Write app models excerpt (this repo)
        if: ${{ !inputs['dry-run'] && inputs['use-ai-inference'] }}
        env:
          APP_MODELS_EXCERPT_PATH: ${{ inputs['app-models-excerpt-path'] }}
        run: |
          set -e
          python3 - <<'PY'
          import os
          from pathlib import Path

          # Fits GitHub Models input cap with system prompt + rest of doc_user_prompt (~8000 tokens total).
          max_bytes = 3500
          raw = (os.environ.get("APP_MODELS_EXCERPT_PATH") or "").strip()
          out_path = Path("canonical_models_excerpt.txt")

          if not raw:
              out_path.write_text(
                  "(app-models-excerpt-path is empty; set workflow_call input app-models-excerpt-path to a file or directory.)\n",
                  encoding="utf-8",
              )
              raise SystemExit(0)

          p = Path(raw)
          if not p.exists():
              out_path.write_text(
                  f"(Path not found in this repository checkout: {raw})\n",
                  encoding="utf-8",
              )
              raise SystemExit(0)

          def clip(s: str) -> str:
              b = s.encode("utf-8")
              if len(b) <= max_bytes:
                  return s
              return b[:max_bytes].decode("utf-8", errors="replace")

          if p.is_file():
              text = p.read_text(encoding="utf-8", errors="replace")
              out_path.write_text(clip(text), encoding="utf-8")
              raise SystemExit(0)

          # Directory: concatenate Swift sources with file headers (same tree as checkout)
          parts: list[str] = []
          for f in sorted(p.rglob("*.swift")):
              if not f.is_file():
                  continue
              try:
                  rel = f.resolve().relative_to(Path.cwd().resolve())
              except ValueError:
                  rel = f
              try:
                  body = f.read_text(encoding="utf-8", errors="replace")
              except OSError:
                  continue
              parts.append(f"\n// --- {rel} ---\n{body}")

          if not parts:
              out_path.write_text(
                  f"(No .swift files under directory: {raw})\n",
                  encoding="utf-8",
              )
              raise SystemExit(0)

          out_path.write_text(clip("".join(parts)), encoding="utf-8")
          PY

      - name: Create documentation brief user prompt
        if: ${{ !inputs['dry-run'] && inputs['use-ai-inference'] }}
        env:
          PR_NUMBER: ${{ steps.pr_and_db_ids.outputs.pr_number }}
          PR_TITLE: ${{ steps.collect_pr.outputs.pr_title }}
          APP_NAME: ${{ steps.detect_app.outputs.app_name }}
          PLATFORM: ${{ steps.detect_app.outputs.platform }}
        run: |
          set -e
          python3 - <<'PY'
          import os

          # GitHub Models (gpt-4.1): 8000-token TOTAL limit for system + user prompt (see 413 errors).
          # Diffs/code tokenize densely (~1.5–3 chars/token); keep user prompt conservative.
          MAX_USER_CHARS = 6500

          def clip(s: str, n: int) -> str:
              s = s or ""
              if len(s) <= n:
                  return s
              return s[:n] + "\n[… truncated …]\n"

          pr_number = os.environ.get("PR_NUMBER", "")
          pr_title = os.environ.get("PR_TITLE", "")
          app_name = os.environ.get("APP_NAME", "")
          platform = os.environ.get("PLATFORM", "")

          pr_body = ""
          if os.path.isfile("pr_body.txt"):
              with open("pr_body.txt", "r", encoding="utf-8", errors="replace") as f:
                  pr_body = f.read()
          pr_body = clip(pr_body.strip(), 1200) or "No description provided"

          changed = ""
          if os.path.isfile("changed_files.txt"):
              with open("changed_files.txt", "r", encoding="utf-8", errors="replace") as f:
                  changed = f.read()
          changed = clip(changed, 2000)

          pr_diff = ""
          if os.path.isfile("pr_diff.txt"):
              with open("pr_diff.txt", "r", encoding="utf-8", errors="replace") as f:
                  pr_diff = f.read()
          pr_diff = clip(pr_diff, 2200)

          cross = ""
          if os.path.isfile("cross_references.txt"):
              with open("cross_references.txt", "r", encoding="utf-8", errors="replace") as f:
                  cross = f.read()
          cross = clip(cross, 800)

          impact = "(none inferred)"
          try:
              import json
              with open("signals.json", "r", encoding="utf-8") as f:
                  s = json.load(f)
              z = s.get("impact_zones") or []
              impact = "\n".join(f"- {x}" for x in z) if z else "(none inferred)"
          except (OSError, json.JSONDecodeError):
              pass
          impact = clip(impact, 800)

          data_models = ""
          if os.path.isfile("data_models_prompt.txt"):
              with open("data_models_prompt.txt", "r", encoding="utf-8", errors="replace") as f:
                  data_models = f.read()
          else:
              data_models = "## Changed files under Data/Models (this PR)\n\n(missing — collect step may have failed.)\n"
          data_models = clip(data_models, 1200)

          canon = ""
          if os.path.isfile("canonical_models_excerpt.txt"):
              with open("canonical_models_excerpt.txt", "r", encoding="utf-8", errors="replace") as f:
                  canon = f.read()
          canon = clip(canon, 2000)

          parts = []
          parts.append(
              "Generate a documentation brief for this pull request. Structure the answer for our Notion proposal sections:\n\n"
              "User-facing summary · Models (Firestore / data) · Structure (UI layout) · Behaviour (interactions) · "
              "Navigation (where from / where to) · Documentation impact · Confidence and gaps.\n"
          )
          parts.append(
              f"## Context\n- **App:** {app_name}\n- **Platform:** {platform}\n- **PR:** #{pr_number} — {pr_title}\n"
          )
          parts.append(f"## PR description (author)\n{pr_body}\n")
          parts.append(f"## Changed files (unique paths)\n{changed}\n")
          parts.append(f"## Impact zones (path heuristic — use only as a hint)\n{impact}\n")
          parts.append(f"## Code diff (truncated)\n```\n{pr_diff}\n```\n")
          parts.append(f"## Cross-references (files referencing touched symbols)\n{cross}\n")
          parts.append(data_models.rstrip() + "\n")
          parts.append(
              "## Canonical reference (read-only; excerpt from this repo — app-models-excerpt-path)\n```\n"
              + canon
              + "\n```\n"
          )

          text = "\n".join(parts)
          if len(text) > MAX_USER_CHARS:
              text = (
                  text[:MAX_USER_CHARS]
                  + "\n\n[… User prompt truncated to satisfy GitHub Models 8000-token input limit …]\n"
              )

          with open("doc_user_prompt.txt", "w", encoding="utf-8") as f:
              f.write(text)
          PY

      - name: Generate documentation brief (AI)
        id: doc_ai
        if: ${{ !inputs['dry-run'] && inputs['use-ai-inference'] }}
        uses: actions/ai-inference@v1
        # gpt-4.1 on GitHub Models: ~8000-token cap on system + user input (413 if exceeded).
        with:
          model: ${{ inputs['ai-model'] }}
          system-prompt-file: ./doc_system_prompt.txt
          prompt-file: ./doc_user_prompt.txt
          max-tokens: ${{ inputs['max-tokens'] }}

      - name: Write documentation brief file for Notion
        if: ${{ !inputs['dry-run'] }}
        env:
          USE_AI_INFERENCE: ${{ inputs['use-ai-inference'] }}
          RESPONSE_FILE: ${{ steps.doc_ai.outputs.response-file }}
        run: |
          set -e
          if [ "${USE_AI_INFERENCE}" = "true" ]; then
            if [ -n "${RESPONSE_FILE:-}" ] && [ -f "${RESPONSE_FILE}" ]; then
              cp "${RESPONSE_FILE}" doc_brief.txt
            else
              echo "(AI documentation brief unavailable — check models: read permission and actions/ai-inference output.)" > doc_brief.txt
            fi
          else
            : > doc_brief.txt
          fi

      # Notion API 2025-09-03+ (incl. 2026-03-11): row queries use data sources, not POST .../databases/.../query.
      # See https://developers.notion.com/docs/upgrade-faqs-2025-09-03
      - name: Resolve Notion data source IDs (API 2025+)
        id: notion_data_sources
        env:
          NOTION_TOKEN: ${{ secrets.notion-token }}
          NOTION_VERSION: ${{ env.NOTION_VERSION }}
          GITHUB_REPOS_DB_ID: ${{ steps.pr_and_db_ids.outputs.github_repos_db_id }}
          PRODUCTS_DB_ID: ${{ steps.pr_and_db_ids.outputs.products_db_id }}
          PROPOSALS_DB_ID: ${{ steps.pr_and_db_ids.outputs.proposals_db_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["NOTION_TOKEN"]
          notion_version = os.environ["NOTION_VERSION"]

          def id_to_dashed(uuid_hex: str) -> str:
            h = uuid_hex.replace("-", "").lower()
            if len(h) != 32:
              return uuid_hex
            return f"{h[0:8]}-{h[8:12]}-{h[12:16]}-{h[16:20]}-{h[20:32]}"

          def notion_request(method, path, payload=None):
            data = None
            if payload is not None:
              data = json.dumps(payload).encode("utf-8")
            headers = {
              "Authorization": f"Bearer {token}",
              "Notion-Version": notion_version,
            }
            if method in ("POST", "PATCH", "PUT"):
              headers["Content-Type"] = "application/json"
            req = urllib.request.Request(
              f"https://api.notion.com{path}",
              data=data,
              method=method,
              headers=headers,
            )
            try:
              with urllib.request.urlopen(req) as r:
                raw = r.read().decode("utf-8")
                return json.loads(raw) if raw.strip() else {}
            except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", "replace")
              hint = ""
              if e.code == 404 and "/databases/" in path:
                hint = " Ensure the database URL/ID is correct and the Notion integration has access to that database."
              raise RuntimeError(f"Notion API {method} {path} failed with HTTP {e.code}: {body}.{hint}") from e

          def notion_get(path):
            return notion_request("GET", path, None)

          def first_data_source_id(database_id_hex: str) -> str:
            dashed = id_to_dashed(database_id_hex)
            data = notion_get(f"/v1/databases/{dashed}")
            sources = data.get("data_sources") or []
            if not sources:
              raise RuntimeError(
                f"GET /v1/databases/{dashed} returned no data_sources. "
                "Notion 2025+ expects a data source per database; check the workspace and integration access."
              )
            ds_id = (sources[0] or {}).get("id")
            if not ds_id:
              raise RuntimeError("data_sources[0] missing id in retrieve database response.")
            return str(ds_id).strip()

          repos_ds = first_data_source_id(os.environ["GITHUB_REPOS_DB_ID"])
          products_ds = first_data_source_id(os.environ["PRODUCTS_DB_ID"])
          proposals_ds = first_data_source_id(os.environ["PROPOSALS_DB_ID"])

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
            out.write(f"github_repos_data_source_id={repos_ds}\n")
            out.write(f"products_data_source_id={products_ds}\n")
            out.write(f"proposals_data_source_id={proposals_ds}\n")
          PY

      - name: Resolve product from Notion (GitHub Repos → Products)
        id: resolve_product
        env:
          NOTION_TOKEN: ${{ secrets.notion-token }}
          NOTION_VERSION: ${{ env.NOTION_VERSION }}
          GITHUB_REPOS_DATA_SOURCE_ID: ${{ steps.notion_data_sources.outputs.github_repos_data_source_id }}
          PRODUCTS_DATA_SOURCE_ID: ${{ steps.notion_data_sources.outputs.products_data_source_id }}
          REPO_NAME: ${{ steps.pr_and_db_ids.outputs.repo_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["NOTION_TOKEN"]
          notion_version = os.environ["NOTION_VERSION"]

          def notion_request(method, path, payload):
            req = urllib.request.Request(
              f"https://api.notion.com{path}",
              data=json.dumps(payload).encode("utf-8"),
              method=method,
              headers={
                "Authorization": f"Bearer {token}",
                "Content-Type": "application/json",
                "Notion-Version": notion_version,
              },
            )
            try:
              with urllib.request.urlopen(req) as r:
                return json.loads(r.read().decode("utf-8"))
            except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", "replace")
              hint = ""
              if e.code == 404 and "/databases/" in path:
                hint = " Ensure the database URL/ID is correct and the Notion integration has access to that database."
              if e.code == 404 and "/data_sources/" in path:
                hint = " Ensure the integration can access this data source (share the database with the integration)."
              raise RuntimeError(f"Notion API {method} {path} failed with HTTP {e.code}: {body}.{hint}") from e

          def notion_post(path, payload):
            return notion_request("POST", path, payload)

          repo_name = os.environ["REPO_NAME"]
          repos_ds = os.environ["GITHUB_REPOS_DATA_SOURCE_ID"]
          products_ds = os.environ["PRODUCTS_DATA_SOURCE_ID"]

          repo_query = notion_post(
            f"/v1/data_sources/{repos_ds}/query",
            {
              "filter": {
                "property": "Name",
                "title": {"equals": repo_name}
              },
              "page_size": 5,
            },
          )
          repo_rows = repo_query.get("results", [])
          product_name = ""
          if repo_rows:
            products_prop = repo_rows[0]["properties"].get("Products", {})
            names = [x.get("name", "") for x in products_prop.get("multi_select", []) if x.get("name")]
            if names:
              product_name = names[0]

          if not product_name:
            raise RuntimeError(
              f"Unable to resolve product for repo '{repo_name}'. Update the GitHub Repos database row (Name + Products)."
            )

          product_query = notion_post(
            f"/v1/data_sources/{products_ds}/query",
            {
              "filter": {
                "property": "Product name",
                "title": {"equals": product_name}
              },
              "page_size": 5,
            },
          )
          product_results = product_query.get("results", [])
          if not product_results:
            raise RuntimeError(f"Product '{product_name}' not found in Products database.")

          product_page = product_results[0]
          product_page_id = product_page["id"]

          product_norm = product_name.lower()
          if "checklist inspector" in product_norm or "cip" in product_norm:
            product_family = "CIP"
          elif "site audit" in product_norm or "sap" in product_norm:
            product_family = "SAP"
          else:
            product_family = "CIP"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
            out.write(f"product_name={product_name}\n")
            out.write(f"product_page_id={product_page_id}\n")
            out.write(f"product_family={product_family}\n")
          PY

      - name: Upsert Proposal page in Notion Proposals database
        if: ${{ !inputs['dry-run'] }}
        env:
          NOTION_TOKEN: ${{ secrets.notion-token }}
          NOTION_VERSION: ${{ env.NOTION_VERSION }}
          PROPOSALS_DATA_SOURCE_ID: ${{ steps.notion_data_sources.outputs.proposals_data_source_id }}
          PR_URL: ${{ steps.collect_pr.outputs.pr_url }}
          PR_NUMBER: ${{ steps.pr_and_db_ids.outputs.pr_number }}
          PR_TITLE: ${{ steps.collect_pr.outputs.pr_title }}
          TOTAL_FILES: ${{ steps.collect_pr.outputs.total_files }}
          SUMMARY_LINE: ${{ steps.collect_pr.outputs.summary_line }}
          PRODUCT_PAGE_ID: ${{ steps.resolve_product.outputs.product_page_id }}
          PRODUCT_NAME: ${{ steps.resolve_product.outputs.product_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["NOTION_TOKEN"]
          notion_version = os.environ["NOTION_VERSION"]

          def notion_request(method, path, payload=None):
            data = None
            if payload is not None:
              data = json.dumps(payload).encode("utf-8")
            headers = {
              "Authorization": f"Bearer {token}",
              "Notion-Version": notion_version,
            }
            if method in ("POST", "PATCH", "PUT"):
              headers["Content-Type"] = "application/json"
            req = urllib.request.Request(
              f"https://api.notion.com{path}",
              data=data,
              method=method,
              headers=headers,
            )
            try:
              with urllib.request.urlopen(req) as r:
                raw = r.read().decode("utf-8")
                return json.loads(raw) if raw.strip() else {}
            except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", "replace")
              hint = ""
              if e.code == 404 and "/databases/" in path:
                hint = " Ensure the database URL/ID is correct and the Notion integration has access to that database."
              if e.code == 404 and "/data_sources/" in path:
                hint = " Ensure the integration can access this data source (share the database with the integration)."
              raise RuntimeError(f"Notion API {method} {path} failed with HTTP {e.code}: {body}.{hint}") from e

          def notion_get(path):
            return notion_request("GET", path, None)

          def notion_post(path, payload):
            return notion_request("POST", path, payload)

          def notion_patch(path, payload):
            return notion_request("PATCH", path, payload)

          def notion_delete(path):
            return notion_request("DELETE", path, None)

          def read_status_name(properties):
            prop = properties.get("Status") or {}
            if prop.get("type") == "status" and prop.get("status"):
              return prop["status"].get("name")
            return None

          def delete_block_recursive(block_id):
            cursor = None
            while True:
              q = f"/v1/blocks/{block_id}/children?page_size=100"
              if cursor:
                q += f"&start_cursor={urllib.parse.quote(cursor)}"
              data = notion_get(q)
              for block in data.get("results", []):
                delete_block_recursive(block["id"])
              if not data.get("has_more"):
                break
              cursor = data.get("next_cursor")
            notion_delete(f"/v1/blocks/{block_id}")

          def clear_page_body(page_id):
            cursor = None
            while True:
              q = f"/v1/blocks/{page_id}/children?page_size=100"
              if cursor:
                q += f"&start_cursor={urllib.parse.quote(cursor)}"
              data = notion_get(q)
              for block in data.get("results", []):
                delete_block_recursive(block["id"])
              if not data.get("has_more"):
                break
              cursor = data.get("next_cursor")

          def append_blocks_batched(page_id, blocks, batch_size=15):
            """Notion rejects oversized request bodies; keep batches small (count + JSON size)."""
            for i in range(0, len(blocks), batch_size):
              chunk = blocks[i : i + batch_size]
              notion_patch(
                f"/v1/blocks/{page_id}/children",
                {"position": {"type": "end"}, "children": chunk},
              )

          def _chunk_string(s, max_chunk):
            return [s[i : i + max_chunk] for i in range(0, len(s), max_chunk)] if s else []

          def _plain_text_segments(plain, max_chunk):
            out = []
            for ch in _chunk_string(plain, max_chunk):
              if ch:
                ch = ch.replace("**", "")
                out.append({"type": "text", "text": {"content": ch}})
            return out

          def rich_text_segments(s, max_chunk=1800):
            """Map inline Markdown **bold** to Notion rich_text (bold annotation)."""
            s = (s or "").replace("\r\n", "\n")
            if not s.strip():
              return [{"type": "text", "text": {"content": " "}}]
            segments = []
            pos = 0
            for m in re.finditer(r"\*\*(.+?)\*\*", s, re.DOTALL):
              if m.start() > pos:
                plain = s[pos : m.start()]
                segments.extend(_plain_text_segments(plain, max_chunk))
              for chunk in _chunk_string(m.group(1), max_chunk):
                if chunk:
                  segments.append(
                      {
                          "type": "text",
                          "text": {"content": chunk},
                          "annotations": {"bold": True},
                      }
                  )
              pos = m.end()
            if pos < len(s):
              segments.extend(_plain_text_segments(s[pos:], max_chunk))
            if not segments:
              return [{"type": "text", "text": {"content": " "}}]
            return segments

          def heading_block(text):
            return {
              "object": "block",
              "type": "heading_3",
              "heading_3": {"rich_text": rich_text_segments((text or "")[:500])},
            }

          PARAGRAPH_MAX_CHARS = 8000  # keep each block's JSON payload bounded

          def paragraph_block(text):
            return {
                "object": "block",
                "type": "paragraph",
                "paragraph": {"rich_text": rich_text_segments(text)},
            }

          def paragraph_blocks_chunked(text):
            """One Notion paragraph block per chunk (long AI sections exceed single-block limits)."""
            t = text or ""
            if not t.strip():
                return [paragraph_block(" ")]
            blocks_out = []
            for i in range(0, len(t), PARAGRAPH_MAX_CHARS):
                blocks_out.append(paragraph_block(t[i : i + PARAGRAPH_MAX_CHARS]))
            return blocks_out

          def paragraph_pr_link_block(url):
            u = (url or "")[:2000]
            return {
              "object": "block",
              "type": "paragraph",
              "paragraph": {
                "rich_text": [
                  {"type": "text", "text": {"content": "Pull request: "}},
                  {"type": "text", "text": {"content": u, "link": {"url": u}}},
                ]
              },
            }

          def bulleted_item_block(text):
            t = (text or "")[:8000]
            return {
                "object": "block",
                "type": "bulleted_list_item",
                "bulleted_list_item": {"rich_text": rich_text_segments(t)},
            }

          def numbered_item_block(text):
            t = (text or "")[:8000]
            return {
                "object": "block",
                "type": "numbered_list_item",
                "numbered_list_item": {"rich_text": rich_text_segments(t)},
            }

          pr_url = os.environ["PR_URL"]
          pr_number = os.environ["PR_NUMBER"]
          pr_title = os.environ["PR_TITLE"]
          total_files = os.environ["TOTAL_FILES"]
          summary_line = (os.environ.get("SUMMARY_LINE") or "").strip()
          product_name = os.environ["PRODUCT_NAME"]
          product_page_id = os.environ["PRODUCT_PAGE_ID"]
          proposals_ds = os.environ["PROPOSALS_DATA_SOURCE_ID"]

          areas = json.load(open("areas.json", "r", encoding="utf-8"))

          doc_brief_raw = ""
          if os.path.isfile("doc_brief.txt"):
            with open("doc_brief.txt", "r", encoding="utf-8") as f:
              doc_brief_raw = f.read()

          # Notion API request body limits — avoid "request body too large" on PATCH/POST children.
          MAX_DOC_BRIEF_CHARS = 55_000
          if len(doc_brief_raw) > MAX_DOC_BRIEF_CHARS:
              doc_brief_raw = (
                  doc_brief_raw[:MAX_DOC_BRIEF_CHARS]
                  + "\n\n[… Documentation brief truncated for Notion API size limits …]\n"
              )

          def summary_for_notion_property(ai_text, fallback):
            t = (ai_text or "").strip()
            if not t:
              return (fallback or "")[:2000]

            def section_after_heading(name):
              m = re.search(
                rf"###\s*{name}\s*\n([\s\S]*?)(?=\n###\s|\Z)",
                t,
                re.IGNORECASE,
              )
              return (m.group(1) or "").strip() if m else ""

            for heading in ("User-facing summary", "Summary", "Overview"):
              body = section_after_heading(heading)
              if body:
                return body.replace("\n", " ").strip()[:2000]

            for heading in ("Behaviour", "Behavior", "Navigation", "Models"):
              body = section_after_heading(heading)
              if not body:
                continue
              for line in body.split("\n"):
                line = re.sub(r"^[-*]\s*", "", line.strip())
                line = re.sub(r"\*\*", "", line).strip()
                if line and "none identified" not in line.lower():
                  return line[:2000]
            return t[:2000]

          base_summary = summary_line or f"{total_files} files across {', '.join(areas)}"
          summary_prop = summary_for_notion_property(doc_brief_raw, base_summary)[:2000]

          properties = {
            "Proposal": {"title": [{"text": {"content": f"PR #{pr_number} - {pr_title}"}}]},
            "Status": {"status": {"name": "Raw Data"}},
            "PR URL": {"url": pr_url},
            "Summary": {"rich_text": [{"text": {"content": summary_prop}}]},
            "Product": {"relation": [{"id": product_page_id}]},
            "Doc Areas": {"multi_select": [{"name": a} for a in areas if a not in ("Other", "CI/Config")]},
          }

          properties_without_status = {k: v for k, v in properties.items() if k != "Status"}

          existing = notion_post(
            f"/v1/data_sources/{proposals_ds}/query",
            {
              "filter": {
                "property": "PR URL",
                "url": {"equals": pr_url}
              },
              "page_size": 1,
            },
          ).get("results", [])

          def markdown_doc_brief_to_blocks(text):
            out = []
            t = (text or "").strip()
            if not t:
              return [
                paragraph_block(
                  "(No AI documentation brief — enable use-ai-inference or inspect the workflow log.)"
                )
              ]
            sections = re.split(r"\n(?=###\s)", t)
            for sec in sections:
              sec = sec.strip()
              if not sec:
                continue
              lines = sec.split("\n")
              first = lines[0].strip()
              if first.startswith("###"):
                title = re.sub(r"^#+\s*", "", first).strip()[:200]
                out.append(heading_block(title))
                body_lines = lines[1:]
              else:
                body_lines = lines
              buf = []

              def flush_buf():
                if buf:
                  para = "\n".join(buf).strip()
                  if para:
                    out.extend(paragraph_blocks_chunked(para))
                  buf.clear()

              for line in body_lines:
                stripped = line.strip()
                if not stripped:
                  flush_buf()
                  continue
                if stripped.startswith(("- ", "* ")):
                  flush_buf()
                  out.append(bulleted_item_block(stripped[2:].strip()))
                elif re.match(r"^\d+\.\s+", stripped):
                  flush_buf()
                  out.append(numbered_item_block(re.sub(r"^\d+\.\s+", "", stripped)))
                else:
                  buf.append(stripped)
              flush_buf()
            return out

          blocks = [paragraph_pr_link_block(pr_url)]
          blocks.extend(markdown_doc_brief_to_blocks(doc_brief_raw))

          if existing:
            page_id = existing[0]["id"]
            row_props = existing[0].get("properties", {})
            status_name = read_status_name(row_props)
            if status_name and status_name != "Raw Data":
              notion_patch(f"/v1/pages/{page_id}", {"properties": properties_without_status})
              print(f"Updated Proposal properties only (Status is {status_name}): {page_id}")
            else:
              clear_page_body(page_id)
              append_blocks_batched(page_id, blocks)
              notion_patch(f"/v1/pages/{page_id}", {"properties": properties})
              print(f"Replaced body and updated Proposal page: {page_id}")
          else:
            # Always create the row without inline children — large `children` arrays exceed Notion body limits.
            created = notion_post(
                "/v1/pages",
                {
                    "parent": {"type": "data_source_id", "data_source_id": proposals_ds},
                    "properties": properties,
                },
            )
            append_blocks_batched(created["id"], blocks)
            print("Created new Proposal page.")
          PY

      - name: Print dry-run summary (no Notion write)
        if: ${{ inputs['dry-run'] }}
        env:
          PR_URL: ${{ steps.collect_pr.outputs.pr_url }}
          PR_TITLE: ${{ steps.collect_pr.outputs.pr_title }}
          CHANGE_SUMMARY: ${{ steps.collect_pr.outputs.change_summary }}
          TOTAL_FILES: ${{ steps.collect_pr.outputs.total_files }}
          SUMMARY_LINE: ${{ steps.collect_pr.outputs.summary_line }}
          PRODUCT_NAME: ${{ steps.resolve_product.outputs.product_name }}
          APP_NAME: ${{ steps.detect_app.outputs.app_name }}
          PLATFORM: ${{ steps.detect_app.outputs.platform }}
        run: |
          echo "Dry run — proposal request summary:"
          echo "  PR: ${PR_URL}"
          echo "  Title: ${PR_TITLE}"
          echo "  App | Platform (QA-style): ${APP_NAME} | ${PLATFORM}"
          echo "  Product (Notion): ${PRODUCT_NAME}"
          echo "  Scope: ${TOTAL_FILES} files — ${CHANGE_SUMMARY}"
          echo "  Summary (property): ${SUMMARY_LINE}"

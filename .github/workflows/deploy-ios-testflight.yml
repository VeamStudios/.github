name: Deploy iOS TestFlight

on:
  workflow_call:
    inputs:
      configuration:
        description: "Deployment configuration: dev, beta, or cloud"
        required: true
        type: string
      environment_name:
        description: "GitHub Environment name for secrets/approvals"
        required: true
        type: string
      ipa_path:
        description: "Path to IPA for version extraction"
        required: true
        type: string
      xcode_version:
        description: "Xcode version to select"
        required: false
        default: "26.2"
        type: string
      checkout_ref:
        description: "Optional git ref to checkout"
        required: false
        default: ""
        type: string
      capture_commit_sha:
        description: "Capture and expose commit SHA output"
        required: false
        default: true
        type: boolean
      upload_cloud_archive:
        description: "Upload cloud archive artifact for release"
        required: false
        default: false
        type: boolean
      upload_release_manifest:
        description: "Upload a release manifest artifact for this deployment"
        required: false
        default: false
        type: boolean
      build_number_override:
        description: "Optional explicit build number override"
        required: false
        default: ""
        type: string
      expected_marketing_version:
        description: "Optional expected marketing version assertion"
        required: false
        default: ""
        type: string
    secrets:
      APP_STORE_CONNECT_API_KEY_CONTENT:
        required: true
      APP_STORE_CONNECT_API_KEY_ID:
        required: true
      APP_STORE_CONNECT_ISSUER_ID:
        required: true
      APPLE_DISTRIBUTION_CERT_BASE64:
        required: true
      APPLE_DISTRIBUTION_CERT_PASSWORD:
        required: true
    outputs:
      version:
        description: "Extracted app version and build"
        value: ${{ jobs.deploy.outputs.version }}
      marketing_version:
        description: "Extracted app marketing version"
        value: ${{ jobs.deploy.outputs.marketing_version }}
      build_number:
        description: "Extracted app build number"
        value: ${{ jobs.deploy.outputs.build_number }}
      commit_sha:
        description: "Checked out commit SHA"
        value: ${{ jobs.deploy.outputs.commit_sha }}
      cloud_archive_artifact_name:
        description: "Uploaded cloud archive artifact name"
        value: ${{ jobs.deploy.outputs.cloud_archive_artifact_name }}
      release_manifest_artifact_name:
        description: "Uploaded release manifest artifact name"
        value: ${{ jobs.deploy.outputs.release_manifest_artifact_name }}
      workflow_run_id:
        description: "Workflow run ID that produced this deployment"
        value: ${{ jobs.deploy.outputs.workflow_run_id }}
      workflow_run_attempt:
        description: "Workflow run attempt that produced this deployment"
        value: ${{ jobs.deploy.outputs.workflow_run_attempt }}
      created_at:
        description: "UTC timestamp when deployment metadata was recorded"
        value: ${{ jobs.deploy.outputs.created_at }}
jobs:
  preflight:
    name: Preflight Deploy Validation
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOT_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.BOT_RELEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout repository (default ref)
        if: inputs.checkout_ref == ''
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app_token.outputs.token }}

      - name: Checkout repository (specific ref)
        if: inputs.checkout_ref != ''
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref }}
          token: ${{ steps.app_token.outputs.token }}

      - name: Setup Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ".ruby-version"
          bundler-cache: true

      - name: Setup App Store Connect API Key
        uses: VeamStudios/.github/.github/actions/setup-asc-api-key@main
        with:
          key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          key-content: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}

      - name: Validate deploy version
        shell: bash
        run: |
          COMMAND=(bundle exec fastlane preflight_deploy "configuration:${{ inputs.configuration }}")
          if [ -n "${{ inputs.expected_marketing_version }}" ]; then
            COMMAND+=("expected_marketing_version:${{ inputs.expected_marketing_version }}")
          fi
          "${COMMAND[@]}"
        env:
          CI: true
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

  deploy:
    name: Build & Deploy to TestFlight
    needs: preflight
    runs-on: macos-26-xlarge
    timeout-minutes: 120
    environment: ${{ inputs.environment_name }}
    concurrency:
      group: ios-deploy-${{ github.repository }}-${{ inputs.configuration }}-${{ github.ref_name }}
      cancel-in-progress: true
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
      marketing_version: ${{ steps.extract_version.outputs.marketing_version }}
      build_number: ${{ steps.extract_version.outputs.build_number }}
      commit_sha: ${{ steps.commit_info.outputs.sha }}
      cloud_archive_artifact_name: ${{ steps.artifact_metadata.outputs.cloud_archive_name }}
      release_manifest_artifact_name: ${{ steps.artifact_metadata.outputs.release_manifest_name }}
      workflow_run_id: ${{ steps.artifact_metadata.outputs.workflow_run_id }}
      workflow_run_attempt: ${{ steps.artifact_metadata.outputs.workflow_run_attempt }}
      created_at: ${{ steps.artifact_metadata.outputs.created_at }}
    steps:
      - name: Mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOT_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.BOT_RELEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Select Xcode
        uses: VeamStudios/.github/.github/actions/select-xcode@main
        with:
          xcode-version: "${{ inputs.xcode_version }}"

      - name: Checkout repository (default ref)
        if: inputs.checkout_ref == ''
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app_token.outputs.token }}

      - name: Checkout repository (specific ref)
        if: inputs.checkout_ref != ''
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref }}
          token: ${{ steps.app_token.outputs.token }}

      - name: Restore SwiftPM cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-xcode-${{ inputs.xcode_version }}-swiftpm-${{ hashFiles('**/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ inputs.xcode_version }}-swiftpm-

      - name: Save commit information
        id: commit_info
        run: |
          if [ "${{ inputs.capture_commit_sha }}" = "true" ]; then
            echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          else
            echo "sha=" >> $GITHUB_OUTPUT
          fi

      - name: Prepare artifact metadata
        id: artifact_metadata
        run: |
          WORKFLOW_RUN_ID="${GITHUB_RUN_ID}"
          WORKFLOW_RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT}"
          CREATED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          CLOUD_ARCHIVE_NAME=""
          if [ "${{ inputs.upload_cloud_archive }}" = "true" ]; then
            CLOUD_ARCHIVE_NAME="cloud-release-artifacts-${WORKFLOW_RUN_ID}-${WORKFLOW_RUN_ATTEMPT}"
          fi

          RELEASE_MANIFEST_NAME=""
          if [ "${{ inputs.upload_release_manifest }}" = "true" ]; then
            RELEASE_MANIFEST_NAME="${{ inputs.configuration }}-release-manifest-${WORKFLOW_RUN_ID}-${WORKFLOW_RUN_ATTEMPT}"
          fi

          echo "cloud_archive_name=${CLOUD_ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_manifest_name=${RELEASE_MANIFEST_NAME}" >> "$GITHUB_OUTPUT"
          echo "workflow_run_id=${WORKFLOW_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "workflow_run_attempt=${WORKFLOW_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "created_at=${CREATED_AT}" >> "$GITHUB_OUTPUT"

      - name: Setup Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ".ruby-version"
          bundler-cache: true

      - name: Setup App Store Connect API Key
        uses: VeamStudios/.github/.github/actions/setup-asc-api-key@main
        with:
          key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          key-content: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}

      - name: Setup Git authentication
        run: |
          git config --global user.email "180547681+veamstudios-release-bot[bot]@users.noreply.github.com"
          git config --global user.name "Release Bot"
          echo "machine github.com login 'Release Bot' password ${{ steps.app_token.outputs.token }}" > ~/.netrc
          chmod 600 ~/.netrc

      - name: Deploy to TestFlight
        shell: bash
        run: |
          COMMAND=(bundle exec fastlane build_and_deploy "configuration:${{ inputs.configuration }}")
          if [ -n "${{ inputs.build_number_override }}" ]; then
            COMMAND+=("build_number:${{ inputs.build_number_override }}")
          fi
          if [ -n "${{ inputs.expected_marketing_version }}" ]; then
            COMMAND+=("expected_marketing_version:${{ inputs.expected_marketing_version }}")
          fi
          "${COMMAND[@]}"
        env:
          CI: true
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_DISTRIBUTION_CERT_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_BASE64 }}
          APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}

      - name: Extract app version
        id: extract_version
        run: |
          IPA_PATH="${{ inputs.ipa_path }}"
          if [ ! -f "$IPA_PATH" ]; then
            echo "::error::IPA not found at $IPA_PATH"
            exit 1
          fi

          TEMP_DIR="temp_extract"
          unzip -q "$IPA_PATH" -d "$TEMP_DIR"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$TEMP_DIR"/Payload/*.app/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$TEMP_DIR"/Payload/*.app/Info.plist)
          rm -rf "$TEMP_DIR"

          echo "marketing_version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD}" >> $GITHUB_OUTPUT
          echo "version=${VERSION} (${BUILD})" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION} (${BUILD})"

      - name: Write deployment summary
        run: |
          {
            echo "## TestFlight Upload"
            echo ""
            echo "- Configuration: ${{ inputs.configuration }}"
            echo "- Marketing Version: ${{ steps.extract_version.outputs.marketing_version }}"
            echo "- Build Number: ${{ steps.extract_version.outputs.build_number }}"
            echo "- Version: ${{ steps.extract_version.outputs.version }}"
            echo "- Commit SHA: ${{ steps.commit_info.outputs.sha }}"
            echo "- Workflow Run ID: ${{ steps.artifact_metadata.outputs.workflow_run_id }}"
            echo "- Workflow Run Attempt: ${{ steps.artifact_metadata.outputs.workflow_run_attempt }}"
            echo "- Created At: ${{ steps.artifact_metadata.outputs.created_at }}"
            if [ "${{ inputs.upload_release_manifest }}" = "true" ]; then
              echo "- Release Manifest Artifact: ${{ steps.artifact_metadata.outputs.release_manifest_name }}"
            fi
            if [ "${{ inputs.upload_cloud_archive }}" = "true" ]; then
              echo "- Cloud Archive Artifact: ${{ steps.artifact_metadata.outputs.cloud_archive_name }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write release manifest
        if: inputs.upload_cloud_archive || inputs.upload_release_manifest
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          manifest = {
              "commit_sha": "${{ steps.commit_info.outputs.sha }}",
              "configuration": "${{ inputs.configuration }}",
              "marketing_version": "${{ steps.extract_version.outputs.marketing_version }}",
              "build_number": "${{ steps.extract_version.outputs.build_number }}",
              "version": "${{ steps.extract_version.outputs.version }}",
              "workflow_run_id": "${{ steps.artifact_metadata.outputs.workflow_run_id }}",
              "workflow_run_attempt": "${{ steps.artifact_metadata.outputs.workflow_run_attempt }}",
              "created_at": "${{ steps.artifact_metadata.outputs.created_at }}",
              "manifest_artifact_name": "${{ steps.artifact_metadata.outputs.release_manifest_name }}",
              "cloud_archive_artifact_name": "${{ steps.artifact_metadata.outputs.cloud_archive_name }}",
          }

          manifest_path = Path("./fastlane/builds/release-manifest.json")
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="ascii")
          PY

      - name: Upload cloud archive for release
        if: inputs.upload_cloud_archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_metadata.outputs.cloud_archive_name }}
          path: |
            ./fastlane/builds/cloud.xcarchive
            ./fastlane/builds/release-manifest.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload release manifest
        if: inputs.upload_release_manifest
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_metadata.outputs.release_manifest_name }}
          path: ./fastlane/builds/release-manifest.json
          retention-days: 30
          if-no-files-found: error

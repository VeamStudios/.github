# Deploy Beta with Merge Gate - Caller Workflow Template
#
# Copy this file into your repo's .github/workflows/ directory and
# customise the deploy job to call your repo's _deploy.yml.
#
# The merge-gate job skips the deploy when no PRs have merged to main
# in the last 24 hours, preventing unnecessary nightly builds.

name: Deploy Beta

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-beta
  cancel-in-progress: true

jobs:
  check-nightly-merge:
    name: Check for recent merges to main
    uses: VeamStudios/.github/.github/workflows/merge-gate.yml@main
    permissions:
      pull-requests: read
    with:
      base_branch: main
      window_hours: 24

  deploy:
    needs: check-nightly-merge
    if: ${{ always() && (github.event_name != 'schedule' || (needs.check-nightly-merge.result == 'success' && needs.check-nightly-merge.outputs.should_deploy == 'true')) }}
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      env: beta

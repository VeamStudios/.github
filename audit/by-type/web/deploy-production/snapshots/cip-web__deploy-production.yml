name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number for the release (e.g. 1.2.3)"
        required: true
        type: string
      release_notes:
        description: "Additional release notes (optional — added to auto-generated notes)"
        required: false
        type: string

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Production
    uses: ./.github/workflows/_deploy.yml
    with:
      deployment_environment: prod
      build_script: build
      firebase_project: checklistinspectorpro
      service_account_file: sa-prod.json
      firebase_config_file: firebase-prod.json
    secrets:
      SERVICE_ACCOUNT_BASE64: ${{ secrets.SERVICE_ACCOUNT_BASE64 }}

  create-release:
    name: Create GitHub Release
    needs: deploy
    uses: VeamStudios/.github/.github/workflows/create-github-release.yml@main
    with:
      version: ${{ inputs.version }}
      deploy_sha: ${{ needs.deploy.outputs.commit_sha }}
      release_notes: ${{ inputs.release_notes }}
    secrets:
      BOT_RELEASE_PRIVATE_KEY: ${{ secrets.BOT_RELEASE_PRIVATE_KEY }}

  update-changelog:
    name: Update Changelog Website
    needs: [deploy, create-release]
    uses: VeamStudios/.github/.github/workflows/update-changelog-website.yml@main
    with:
      source_file: CHANGELOG.md
      deployed_ref: ${{ needs.deploy.outputs.commit_sha }}
      destination_repo: VeamStudios/checklistinspectorpro.com
      destination_folder: src/assets/changelog-web
      version: v${{ inputs.version }}
    secrets: inherit

  notify:
    name: Notify Release
    needs: [deploy, create-release]
    uses: VeamStudios/.github/.github/workflows/notify-release.yml@main
    with:
      version: v${{ inputs.version }}
      environment: production
    secrets:
      SLACK_RELEASES_WEBHOOK_URL: ${{ secrets.SLACK_RELEASES_WEBHOOK_URL }}

  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy, create-release, update-changelog, notify]
    if: always()
    steps:
      - name: Display Summary
        run: |
          echo "Deploy Production completed!"
          echo "Release: v${VERSION}"
          echo "Commit: ${DEPLOY_SHA}"
          echo "Release URL: ${SERVER_URL}/${REPO}/releases/tag/v${VERSION}"
        env:
          VERSION: ${{ inputs.version }}
          DEPLOY_SHA: ${{ needs.deploy.outputs.commit_sha }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}

name: PR Governance

on:
  workflow_call:
    inputs:
      bot-qa-client-id:
        description: 'GitHub App client ID used to mint the QA bot token'
        required: false
        default: ''
        type: string
      bot-qa-app-id:
        description: 'Deprecated compatibility input. Use bot-qa-client-id instead.'
        required: false
        default: ''
        type: string
      merge-method:
        description: 'Merge method to use (merge, squash, rebase)'
        required: false
        type: string
        default: 'squash'
    secrets:
      BOT_QA_PRIVATE_KEY:
        required: true

jobs:
  has-linked-notion-work-item:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: has-linked-notion-work-item-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      checks: write
      pull-requests: read

    steps:
      - name: Post "Has Linked Notion Work Item" check
        uses: actions/github-script@v8
        with:
          script: |
            const CHECK_NAME = 'Has Linked Notion Work Item';
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('Expected pull_request event payload');
              return;
            }

            const prTitle = (pr.title ?? '').trim();
            const featPr = /^feat(?:\([^)]+\))?!?:/i.test(prTitle);

            if (!featPr) {
              const summary =
                `Work Item link is only required when the PR title uses the \`feat\` prefix (this title: \`${prTitle}\`).`;
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: CHECK_NAME,
                head_sha: pr.head.sha,
                status: 'completed',
                conclusion: 'success',
                output: {
                  title: 'Not required',
                  summary,
                },
              });
              return;
            }

            const body = (pr.body ?? '').replace(/\r\n?/g, '\n');
            const notionWorkItemUrl =
              /^https:\/\/(?:[a-z0-9-]+\.)?notion\.(?:so|site|com)\/[^\s]*([0-9a-f]{32}|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(?:[^\s]*)$/i;

            const listedUrls = [];
            const invalidEntries = [];
            const addEntry = (entry) => {
              const value = entry.trim();
              const markdownLink = value.match(/^\[[^\]\n]+\]\((https:\/\/[^\s)]+)\)$/);
              const url = markdownLink?.[1] ?? value;
              if (notionWorkItemUrl.test(url)) {
                if (!listedUrls.includes(url)) listedUrls.push(url);
              } else {
                invalidEntries.push(value || '(empty entry)');
              }
            };

            const lines = body.split('\n');
            let inWorkItemsList = false;
            for (const line of lines) {
              const singular = line.match(
                /^\s*(?:[-*]\s*)?(?:\*\*)?(?:Notion\s+)?Work\s*Item(?:\*\*)?\s*:\s*(?:\*\*)?\s*(.+?)\s*$/i,
              );
              if (singular) {
                inWorkItemsList = false;
                addEntry(singular[1]);
                continue;
              }

              const pluralHeader =
                /^\s*(?:#{1,6}\s*)?(?:\*\*)?(?:Notion\s+)?Work\s*Items(?:\*\*)?\s*:\s*(?:\*\*)?\s*$/i.test(
                  line,
                );
              if (pluralHeader) {
                inWorkItemsList = true;
                continue;
              }

              if (!inWorkItemsList) continue;
              if (!line.trim()) {
                inWorkItemsList = false;
                continue;
              }

              if (/^\s*#{1,6}\s+/.test(line)) {
                inWorkItemsList = false;
                continue;
              }

              const bullet = line.match(/^\s*[-*]\s+(.+?)\s*$/);
              if (!bullet) {
                invalidEntries.push(line.trim());
                continue;
              }
              addEntry(bullet[1]);
            }

            const linked = listedUrls.length > 0 && invalidEntries.length === 0;
            const conclusion = linked ? 'success' : 'failure';
            const summary = linked
              ? `${listedUrls.length} valid Notion Work Item URL${listedUrls.length === 1 ? '' : 's'} found in the PR description.`
              : invalidEntries.length > 0
                ? 'Every entry under `Work Items:` (or on a `Work Item:` line) must be a valid Notion Work Item URL.'
                : 'Add a `Work Items:` list containing at least one Notion Work Item URL. The field is required for `feat` PRs, including scoped or breaking forms; singular `Work Item:` remains supported.';

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: CHECK_NAME,
              head_sha: pr.head.sha,
              status: 'completed',
              conclusion,
              output: {
                title: linked
                  ? `${listedUrls.length} Work Item${listedUrls.length === 1 ? '' : 's'} linked`
                  : 'Work Item not linked',
                summary,
              },
            });

            if (!linked) {
              core.setFailed(summary);
            }

  qa-project-status:
    if: "github.event.action == 'labeled' && github.event.label.name == 'bot: qa needed'"
    runs-on: ubuntu-latest
    concurrency:
      group: qa-project-status-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Validate QA bot configuration
        run: |
          if [ -z "${{ secrets.BOT_QA_PRIVATE_KEY }}" ]; then
            echo "::error::Required workflow secret BOT_QA_PRIVATE_KEY is missing"
            exit 1
          fi

      - name: Mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.bot-qa-client-id || vars.BOT_QA_CLIENT_ID }}
          private-key: ${{ secrets.BOT_QA_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Set QA project status to Not Started
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            const PROJECT_NUMBER = 26;

            const pr = context.payload.pull_request;
            if (!pr?.node_id) {
              core.setFailed('Expected pull_request event payload with a node ID');
              return;
            }

            const config = await github.graphql(
              `query($org: String!, $number: Int!) {
                organization(login: $org) {
                  projectV2(number: $number) {
                    id
                    fields(first: 100) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options { id name }
                        }
                      }
                    }
                  }
                }
              }`,
              {
                org: context.repo.owner,
                number: PROJECT_NUMBER,
              },
            );

            const project = config.organization?.projectV2;
            const statusField = project?.fields.nodes.find(
              (field) => field.name === 'Status',
            );
            const notStartedOption = statusField?.options.find(
              (option) => option.name === 'Not Started',
            );
            if (!project || !statusField || !notStartedOption) {
              core.setFailed(
                `Project ${PROJECT_NUMBER} must contain a Status field with a Not Started option`,
              );
              return;
            }

            const findProjectItem = async () => {
              const result = await github.graphql(
                `query($contentId: ID!) {
                  node(id: $contentId) {
                    ... on PullRequest {
                      projectItems(first: 100) {
                        nodes {
                          id
                          project { id }
                        }
                      }
                    }
                  }
                }`,
                { contentId: pr.node_id },
              );

              return result.node?.projectItems.nodes.find(
                (item) => item.project.id === project.id,
              )?.id;
            };

            let itemId = await findProjectItem();
            if (!itemId) {
              try {
                const result = await github.graphql(
                  `mutation($projectId: ID!, $contentId: ID!) {
                    addProjectV2ItemById(input: {
                      projectId: $projectId
                      contentId: $contentId
                    }) {
                      item { id }
                    }
                  }`,
                  {
                    projectId: project.id,
                    contentId: pr.node_id,
                  },
                );
                itemId = result.addProjectV2ItemById.item.id;
              } catch (error) {
                // Project 26 also has a built-in auto-add workflow. If both
                // automations add the PR concurrently, resolve the existing
                // item instead of failing or creating a duplicate.
                for (let attempt = 0; attempt < 3 && !itemId; attempt += 1) {
                  await new Promise((resolve) => setTimeout(resolve, 1000));
                  itemId = await findProjectItem();
                }
                if (!itemId) throw error;
              }
            }

            await github.graphql(
              `mutation(
                $projectId: ID!
                $itemId: ID!
                $fieldId: ID!
                $optionId: String!
              ) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item { id }
                }
              }`,
              {
                projectId: project.id,
                itemId,
                fieldId: statusField.id,
                optionId: notStartedOption.id,
              },
            );

            core.info(
              `Set Project ${PROJECT_NUMBER} item ${itemId} to Not Started for ${context.repo.owner}/${context.repo.repo}#${pr.number}`,
            );

  merge:
    if: "github.event.label.name == 'bot: qa approved' && contains(github.event.pull_request.labels.*.name, 'bot: qa needed') && contains(github.event.pull_request.labels.*.name, 'bot: qa automerge')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Validate QA bot configuration
        run: |
          if [ -z "${{ secrets.BOT_QA_PRIVATE_KEY }}" ]; then
            echo "::error::Required workflow secret BOT_QA_PRIVATE_KEY is missing"
            exit 1
          fi

      - name: Mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.bot-qa-client-id || vars.BOT_QA_CLIENT_ID }}
          private-key: ${{ secrets.BOT_QA_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Merge PR
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Merging PR #${PR_NUMBER}: ${PR_TITLE}"

          gh pr merge "${PR_NUMBER}" \
            --repo "${{ github.repository }}" \
            --${{ inputs.merge-method }} \
            --auto

          echo "PR #${PR_NUMBER} merged successfully"

name: Release new version

on:
  pull_request:
    branches: [main]
    types: [closed]

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "version"
  cancel-in-progress: true

jobs:
  bump_minor_and_release:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js with GitHub Packages
        uses: VeamStudios/.github/.github/actions/setup-node-github-packages@main
        with:
          node-version: "20.x"

      - name: Set account identity
        run: |
          git config --global user.email 180547681+veamstudios-release-bot[bot]@users.noreply.github.com
          git config --global user.name "Release Bot"

      - name: Bump minor version
        run: yarn version --minor

      - name: Read bumped version
        id: version
        run: echo "new_version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Verify changelog entry before push and publish
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.new_version }}"
          chmod +x ./scripts/extract-changelog-lines.sh
          ./scripts/extract-changelog-lines.sh "$version" > /dev/null

      - name: Push commit and tag
        run: |
          version="$(jq -r .version package.json)"
          git push origin
          git push origin "v$version"

      - name: Publish the '@veamstudios/sap' package
        run: yarn publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mint GitHub App token (Release Bot)
        id: release_bot_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_RELEASE_APP_ID }}
          private-key: ${{ secrets.BOT_RELEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ steps.release_bot_token.outputs.token }}
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          chmod +x ./scripts/extract-changelog-lines.sh
          if changelog_lines="$(./scripts/extract-changelog-lines.sh "$version")"; then
            gh release create "v$version" \
              --title "v$version" \
              --notes "$changelog_lines"
          else
            gh release create "v$version" \
              --title "v$version" \
              --generate-notes
          fi

      - name: Notify client repos
        uses: actions/github-script@v7
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        with:
          github-token: ${{ secrets.VEAM_READ_TOKEN }}
          script: |
            const repos = ['SiteAuditPro-Backend', 'SiteAuditPro-Web', 'SiteAuditPro-iOS'];

            const results = await Promise.allSettled(
              repos.map((repo) =>
                github.rest.repos.createDispatchEvent({
                  owner: 'veamstudios',
                  repo,
                  event_type: 'sap-models-update',
                  client_payload: { version: process.env.NEW_VERSION }
                })
              )
            );

            const failures = results
              .map((result, index) => ({ repo: repos[index], result }))
              .filter(({ result }) => result.status === 'rejected');

            for (const { repo, result } of failures) {
              core.error(`Failed to notify ${repo}: ${result.reason.message}`);
            }

            if (failures.length > 0) {
              throw new Error(`Failed to notify ${failures.length} client repos.`);
            }

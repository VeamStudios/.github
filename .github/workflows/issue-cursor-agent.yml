name: Issue Cursor Agent

on:
  workflow_call:
    inputs:
      github-app-id:
        description: "GitHub App ID used to mint the bot token"
        required: true
        type: string
      fix-label:
        description: "Issue label that should trigger a code-fix run"
        required: false
        type: string
        default: "bot: fix"
      triage-label:
        description: "Issue label that should trigger a triage-only run"
        required: false
        type: string
        default: "bot: triage"
      cursor-model:
        description: "Cursor model passed to the headless agent"
        required: false
        type: string
        default: "gpt-5.5-high"
      branch-prefix:
        description: "Branch prefix used for fix PR branches"
        required: false
        type: string
        default: "cursor/issue"
      setup-command:
        description: "Optional repo setup command run before invoking Cursor"
        required: false
        type: string
        default: ""
      test-command:
        description: "Optional deterministic verification command run after a fix"
        required: false
        type: string
        default: ""
      extra-prompt:
        description: "Optional extra instructions appended to the Cursor prompt"
        required: false
        type: string
        default: ""
      post-start-comment:
        description: "Whether to post a status comment when the workflow starts"
        required: false
        type: boolean
        default: true
    secrets:
      GITHUB_APP_PRIVATE_KEY:
        required: true
      CURSOR_API_KEY:
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: cursor-issue-${{ github.repository }}-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  route:
    if: github.event.action == 'labeled' && github.event.repository.archived != true && github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.route.outputs.mode }}
      branch_name: ${{ steps.route.outputs.branch_name }}
      should_run: ${{ steps.route.outputs.should_run }}
    steps:
      - name: Resolve requested mode
        id: route
        uses: actions/github-script@v8
        env:
          FIX_LABEL: ${{ inputs.fix-label }}
          TRIAGE_LABEL: ${{ inputs.triage-label }}
          BRANCH_PREFIX: ${{ inputs.branch-prefix }}
        with:
          script: |
            const label = context.payload.label?.name || "";
            let mode = "";

            if (label === process.env.FIX_LABEL) {
              mode = "fix";
            } else if (label === process.env.TRIAGE_LABEL) {
              mode = "triage";
            }

            core.setOutput("mode", mode);
            core.setOutput("should_run", mode ? "true" : "false");
            core.setOutput("branch_name", `${process.env.BRANCH_PREFIX}/${context.payload.issue.number}`);

      - name: Skip unrelated labels
        if: steps.route.outputs.should_run != 'true'
        run: echo "Label does not match the configured Cursor agent labels."

  fix:
    name: Fix issue with Cursor
    needs: route
    if: needs.route.outputs.mode == 'fix'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Cursor configuration
        run: |
          if [ -z "${{ inputs.github-app-id }}" ]; then
            echo "::error::Required workflow input github-app-id is missing"
            exit 1
          fi

          if [ -z "${{ secrets.GITHUB_APP_PRIVATE_KEY }}" ]; then
            echo "::error::Required workflow secret GITHUB_APP_PRIVATE_KEY is missing"
            exit 1
          fi

          if [ -z "${{ secrets.CURSOR_API_KEY }}" ]; then
            echo "::error::Required workflow secret CURSOR_API_KEY is missing"
            exit 1
          fi

      - name: Mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ inputs.github-app-id }}
          private-key: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Post started comment
        if: inputs.post-start-comment
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body \
            "Cursor started a fix run for this issue. Follow progress in [workflow run]($RUN_URL)."

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Prepare working branch
        shell: bash
        env:
          BRANCH_NAME: ${{ needs.route.outputs.branch_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$DEFAULT_BRANCH" "$BRANCH_NAME" || true

          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH_NAME"; then
            git checkout -B "$BRANCH_NAME" "origin/$BRANCH_NAME"
          else
            git checkout -B "$BRANCH_NAME" "origin/$DEFAULT_BRANCH"
          fi

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Run repo setup command
        if: inputs.setup-command != ''
        shell: bash
        run: ${{ inputs.setup-command }}

      - name: Build fix prompt
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
          TEST_COMMAND: ${{ inputs.test-command }}
          EXTRA_PROMPT: ${{ inputs.extra-prompt }}
          TRIGGER_LABEL: ${{ github.event.label.name }}
        run: |
          python3 <<'PY'
          import os
          import pathlib

          issue_body = (os.environ.get("ISSUE_BODY") or "").strip()
          test_command = (os.environ.get("TEST_COMMAND") or "").strip()
          extra_prompt = (os.environ.get("EXTRA_PROMPT") or "").strip()

          prompt = f"""You are running inside GitHub Actions for repository {os.environ["REPOSITORY"]}.

          Task: attempt a minimal, reviewable fix for issue #{os.environ["ISSUE_NUMBER"]}.
          Trigger label: {os.environ["TRIGGER_LABEL"]}

          Issue title:
          {os.environ["ISSUE_TITLE"]}

          Issue body:
          {issue_body if issue_body else "No issue body provided."}

          Constraints:
          - Modify only the files needed for this fix.
          - Do not create branches, commit, push, open pull requests, or post GitHub comments.
          - Do not modify deployment workflows, release automation, secrets, environment files, or versioning unless the issue explicitly requires it.
          - Keep the diff small and auditable.
          - Add or update tests when the logic changes and nearby tests make that practical.
          - Prefer deterministic repo commands over speculation.

          Verification:
          - If a test command is provided, make sure your changes are compatible with it.
          - Test command: {test_command if test_command else "No deterministic test command was supplied."}

          Output requirements:
          - Return markdown with exactly these sections:
            ## Summary
            ## Tests
            ## Risks
          - In Tests, list the commands you ran or write "Not run" with a short reason.
          - In Risks, mention any remaining ambiguity or follow-up a reviewer should check.
          """

          if extra_prompt:
              prompt += f"\nAdditional repo instructions:\n{extra_prompt}\n"

          pathlib.Path("cursor_fix_prompt.txt").write_text(prompt, encoding="utf-8")
          PY

      - name: Run Cursor fix
        shell: bash
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_MODEL: ${{ inputs.cursor-model }}
        run: |
          agent -p --force --output-format text --model "$CURSOR_MODEL" "$(cat cursor_fix_prompt.txt)" | tee cursor_agent_output.md

      - name: Run deterministic verification
        if: inputs.test-command != ''
        shell: bash
        run: ${{ inputs.test-command }} | tee cursor_test_output.txt

      - name: Ensure changes exist
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "::error::Cursor completed without producing a file change."
            exit 1
          fi

      - name: Configure git author
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Commit and push fix branch
        shell: bash
        env:
          BRANCH_NAME: ${{ needs.route.outputs.branch_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git add -A
          git reset -- cursor_agent_output.md cursor_fix_prompt.txt

          if git diff --cached --quiet; then
            echo "::error::No staged changes were found after the Cursor run."
            exit 1
          fi

          git commit -m "fix: resolve issue #${ISSUE_NUMBER}"
          git push -u origin "$BRANCH_NAME"

      - name: Create or update pull request
        id: pr
        uses: actions/github-script@v8
        env:
          BRANCH_NAME: ${{ needs.route.outputs.branch_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const head = `${owner}:${process.env.BRANCH_NAME}`;
            const base = context.payload.repository.default_branch;
            const body = [
              `Fixes #${process.env.ISSUE_NUMBER}`,
              "",
              fs.readFileSync("cursor_agent_output.md", "utf8").trim(),
              "",
              "## Provenance",
              `- Trigger label: \`${context.payload.label.name}\``,
              `- Workflow run: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            ].join("\n");

            const { data: existingPullRequests } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head
            });

            if (existingPullRequests.length > 0) {
              const pullRequest = existingPullRequests[0];
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pullRequest.number,
                title: `fix: ${process.env.ISSUE_TITLE} (#${process.env.ISSUE_NUMBER})`,
                body
              });

              core.setOutput("pr_number", String(pullRequest.number));
              core.setOutput("pr_url", pullRequest.html_url);
              return;
            }

            const { data: pullRequest } = await github.rest.pulls.create({
              owner,
              repo,
              title: `fix: ${process.env.ISSUE_TITLE} (#${process.env.ISSUE_NUMBER})`,
              head: process.env.BRANCH_NAME,
              base,
              body
            });

            core.setOutput("pr_number", String(pullRequest.number));
            core.setOutput("pr_url", pullRequest.html_url);

      - name: Comment with PR link
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body \
            "Cursor opened or updated PR #$PR_NUMBER: $PR_URL"

  triage:
    name: Triage issue with Cursor
    needs: route
    if: needs.route.outputs.mode == 'triage'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Cursor configuration
        run: |
          if [ -z "${{ inputs.github-app-id }}" ]; then
            echo "::error::Required workflow input github-app-id is missing"
            exit 1
          fi

          if [ -z "${{ secrets.GITHUB_APP_PRIVATE_KEY }}" ]; then
            echo "::error::Required workflow secret GITHUB_APP_PRIVATE_KEY is missing"
            exit 1
          fi

          if [ -z "${{ secrets.CURSOR_API_KEY }}" ]; then
            echo "::error::Required workflow secret CURSOR_API_KEY is missing"
            exit 1
          fi

      - name: Mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ inputs.github-app-id }}
          private-key: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Post started comment
        if: inputs.post-start-comment
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body \
            "Cursor started a triage run for this issue. Follow progress in [workflow run]($RUN_URL)."

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Run repo setup command
        if: inputs.setup-command != ''
        shell: bash
        run: ${{ inputs.setup-command }}

      - name: Build triage prompt
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
          EXTRA_PROMPT: ${{ inputs.extra-prompt }}
          TRIGGER_LABEL: ${{ github.event.label.name }}
        run: |
          python3 <<'PY'
          import os
          import pathlib

          issue_body = (os.environ.get("ISSUE_BODY") or "").strip()
          extra_prompt = (os.environ.get("EXTRA_PROMPT") or "").strip()

          prompt = f"""You are running inside GitHub Actions for repository {os.environ["REPOSITORY"]}.

          Task: triage issue #{os.environ["ISSUE_NUMBER"]} without making file changes.
          Trigger label: {os.environ["TRIGGER_LABEL"]}

          Issue title:
          {os.environ["ISSUE_TITLE"]}

          Issue body:
          {issue_body if issue_body else "No issue body provided."}

          Constraints:
          - Do not modify files.
          - Do not create branches, commit, push, open pull requests, or post GitHub comments.
          - Use the repository contents to ground your conclusions where possible.
          - Be concise and action-oriented.

          Output requirements:
          - Return markdown with exactly these sections:
            ## Summary
            ## Likely Area
            ## Missing Info
            ## Next Steps
          - Missing Info should say "None" when the issue is actionable as written.
          - Next Steps should be a short flat bullet list.
          """

          if extra_prompt:
              prompt += f"\nAdditional repo instructions:\n{extra_prompt}\n"

          pathlib.Path("cursor_triage_prompt.txt").write_text(prompt, encoding="utf-8")
          PY

      - name: Run Cursor triage
        shell: bash
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_MODEL: ${{ inputs.cursor-model }}
        run: |
          agent -p --force --output-format text --model "$CURSOR_MODEL" "$(cat cursor_triage_prompt.txt)" | tee cursor_triage_output.md

      - name: Comment with triage summary
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          {
            echo "Cursor triage completed."
            echo ""
            cat cursor_triage_output.md
          } > cursor_issue_comment.md

          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body-file cursor_issue_comment.md

  fix-failure:
    name: Report fix failure
    needs:
      - route
      - fix
    if: needs.route.outputs.mode == 'fix' && needs.fix.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ inputs.github-app-id }}
          private-key: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Comment on issue failure
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body \
            "Cursor could not complete the requested fix. Review the [workflow run]($RUN_URL) for details and continue manually if needed."

  triage-failure:
    name: Report triage failure
    needs:
      - route
      - triage
    if: needs.route.outputs.mode == 'triage' && needs.triage.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ inputs.github-app-id }}
          private-key: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Comment on issue failure
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body \
            "Cursor could not complete the requested triage. Review the [workflow run]($RUN_URL) for details and continue manually if needed."

# PR Governance - Caller Workflow
#
# Copy to .github/workflows/qa.yml in app repos.
# Calls VeamStudios/.github qa-pipeline.yml.
#
# Requires: secrets.BOT_QA_PRIVATE_KEY
# Requires org variable: BOT_QA_CLIENT_ID
# QA GitHub App permission: Organization Projects (write)
#
# Behaviour:
# - PR opened / updated → required "Work Item gate" (`Work Items:` link required for feat titles)
# - Work Item creation is offered by the separate Notion bot check.
# - `bot: qa needed` → add the PR to QA Project 26 and set its status to Not Started
# - QA labels never merge PRs or enable auto-merge; developers decide when to merge
# - `bot: qa needed` → QA Brief is provided by the Cursor Automation, not GitHub Actions
#
# Branch protection: require "pr-governance / Work Item gate" from GitHub Actions.
# Enable the repository in the hosted PR Work Items worker for the Create button.

name: PR Governance

on:
  pull_request:
    types: [opened, synchronize, edited, labeled]

jobs:
  pr-governance:
    uses: VeamStudios/.github/.github/workflows/qa-pipeline.yml@main
    permissions:
      contents: write
      pull-requests: write
    secrets:
      BOT_QA_PRIVATE_KEY: ${{ secrets.BOT_QA_PRIVATE_KEY }}

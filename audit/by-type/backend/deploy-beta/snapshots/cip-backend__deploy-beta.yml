name: Deploy Beta

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-beta
  cancel-in-progress: true

jobs:
  check-nightly-merge:
    name: Check for recent merges to main
    uses: VeamStudios/.github/.github/workflows/merge-gate.yml@main
    permissions:
      pull-requests: read
    with:
      base_branch: main
      window_hours: 24
      max_pages: 10

  deploy:
    needs: check-nightly-merge
    if: ${{ always() && (github.event_name != 'schedule' || (needs.check-nightly-merge.result == 'success' && needs.check-nightly-merge.outputs.should_deploy == 'true')) }}
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      env: beta
      publish_dummy_data: true

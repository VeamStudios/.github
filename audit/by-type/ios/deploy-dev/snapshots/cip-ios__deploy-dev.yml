name: Deploy Dev

on:
  workflow_dispatch:

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-dev:
    name: Build & Deploy Dev to TestFlight
    uses: VeamStudios/.github/.github/workflows/deploy-ios-testflight.yml@main
    with:
      configuration: dev
      environment_name: dev
      ipa_path: ./fastlane/builds/com.veamstudios.checklistinspectorpro.dev.ipa
      capture_commit_sha: true
      upload_cloud_archive: false
    secrets: inherit

  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-dev]
    steps:
      - name: Display Summary
        run: |
          echo "Deploy Dev completed!"
          echo "Dev Version: ${{ needs.deploy-dev.outputs.version }}"
          echo "Commit: ${{ needs.deploy-dev.outputs.commit_sha }}"

name: Remote Config → Notion Sync
description: Syncs production Remote Config values to Work Items and evidence to the release ledger.

inputs:
  product:
    description: "Product slug used to resolve the Notion Product page ID. Supported values: cip, sap."
    required: false
    default: ""
  product_page_id:
    description: "Optional Notion Product page ID override used to filter Notion Work Items."
    required: false
    default: ""
  work_items_data_source_id:
    description: "Notion Work Items data source ID."
    required: false
    default: "20aeddfe-a3f7-41e9-b440-c9eb6b26887f"
  platform:
    description: "Remote Config platform filter: ios, web, android, backend, or all."
    required: false
    default: "all"
  firebase_project_id:
    description: "Optional Firebase project ID for production Remote Config reads."
    required: false
    default: ""
  firebase_service_account:
    description: "Optional Firebase service account JSON or base64 JSON."
    required: false
    default: ""
  notion_token:
    description: "Notion API token with access to Work Items, Products and Feature Availability."
    required: false
    default: ""
  dry_run:
    description: "Compute updates and print a summary without writing Notion."
    required: false
    default: "false"

outputs:
  matched_pages:
    description: "Number of Notion Work Items matched."
    value: ${{ steps.sync.outputs.matched_pages }}
  updated_pages:
    description: "Number of Notion Work Items updated."
    value: ${{ steps.sync.outputs.updated_pages }}
  remote_config_checked:
    description: "Number of Remote Config keys checked."
    value: ${{ steps.sync.outputs.remote_config_checked }}

runs:
  using: composite
  steps:
    - name: Remote Config → Notion Sync
      id: sync
      shell: bash
      env:
        INPUT_PRODUCT_PAGE_ID: ${{ inputs.product_page_id }}
        INPUT_PRODUCT: ${{ inputs.product }}
        INPUT_WORK_ITEMS_DATA_SOURCE_ID: ${{ inputs.work_items_data_source_id }}
        INPUT_PLATFORM: ${{ inputs.platform }}
        INPUT_FIREBASE_PROJECT_ID: ${{ inputs.firebase_project_id }}
        INPUT_FIREBASE_SERVICE_ACCOUNT: ${{ inputs.firebase_service_account }}
        INPUT_NOTION_TOKEN: ${{ inputs.notion_token }}
        INPUT_DRY_RUN: ${{ inputs.dry_run }}
      run: node "${{ github.action_path }}/sync.js"

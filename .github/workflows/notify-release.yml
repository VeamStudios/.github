name: Notify Release

on:
  workflow_call:
    inputs:
      version:
        description: "Release version tag (e.g. v1.2.3)"
        required: true
        type: string
      environment:
        description: "Deployment environment (e.g. production)"
        required: true
        type: string
      slack_footer_mrkdwn:
        description: "Footer context block (mrkdwn). Override per app to mention a subteam or add custom messaging."
        required: false
        default: "Please inform any customers waiting on fixes in this release."
        type: string
    secrets:
      SLACK_RELEASES_WEBHOOK_URL:
        description: "Incoming webhook URL for the Slack releases channel"
        required: true

jobs:
  notify:
    name: Send Slack notification
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_RELEASES_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "*${{ github.repository }}* — <${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.version }}|${{ inputs.version }}> deployed to ${{ inputs.environment }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*${{ github.repository }}* — <${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.version }}|${{ inputs.version }}> deployed to ${{ inputs.environment }}\n\nSee the <${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.version }}|full release notes> for details."
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "${{ inputs.slack_footer_mrkdwn }}"
                    }
                  ]
                }
              ]
            }

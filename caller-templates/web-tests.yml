# Web Tests - Caller Workflow
#
# Copy this file into a Node-based repo at `.github/workflows/tests.yml`.
# Intended for: ChecklistInspectorPro-Web, ChecklistInspectorPro-Backend,
#               SiteAuditPro-Web, SiteAuditPro-Backend.
#
# Runs on every pull request. Pair with `web-ci.yml` (lint/typecheck/build).

name: Tests

on: [pull_request]

permissions:
  contents: read
  packages: read

jobs:
  tests:
    uses: VeamStudios/.github/.github/workflows/web-tests.yml@main

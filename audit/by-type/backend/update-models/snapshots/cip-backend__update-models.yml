name: Update CIP Models
on:
  repository_dispatch:
    types: [cip-models-update]

permissions:
  contents: write
  packages: read
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token (Release Bot)
        id: release_bot_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_RELEASE_APP_ID }}
          private-key: ${{ secrets.BOT_RELEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.release_bot_token.outputs.token }}

      - name: Configure Git author
        run: |
          git config --global user.email "180547681+veamstudios-release-bot[bot]@users.noreply.github.com"
          git config --global user.name "Release Bot"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: yarn

      - name: Log in to the registry
        run: |
          npm set "@veamstudios:registry" "https://npm.pkg.github.com"
          npm set "//npm.pkg.github.com/:_authToken" "${{ secrets.GITHUB_TOKEN }}"

      - name: Update package
        run: yarn upgrade "@veamstudios/cip@${CIP_VERSION}"
        env:
          CIP_VERSION: ${{ github.event.client_payload.version }}

      - name: Detect package changes
        id: detect_changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No package changes detected; skipping PR creation."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR
        if: steps.detect_changes.outputs.has_changes == 'true'
        uses: actions/github-script@v8
        env:
          CIP_VERSION: ${{ github.event.client_payload.version }}
          RUN_ID: ${{ github.run_id }}
        with:
          github-token: ${{ steps.release_bot_token.outputs.token }}
          script: |
            const version = process.env.CIP_VERSION;
            const runId = process.env.RUN_ID;
            const branch = `chore/update-cip-models-${version}-${runId}`;
            await exec.exec('git', ['checkout', '-b', branch]);
            await exec.exec('git', ['add', '.']);
            await exec.exec('git', ['commit', '-m', `chore: update @veamstudios/cip to ${version}`]);
            await exec.exec('git', ['push', 'origin', branch]);
            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `chore: update CIP Models to ${version}`,
              head: branch,
              base: 'main',
              body: `Auto-generated by CIP-Models CI.\nUpdates \`@veamstudios/cip\` to \`${version}\`.`
            });
